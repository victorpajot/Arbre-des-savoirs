<title>Arbre des savoirs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : une fiche de personnage en une colonne de téléphone, onglets en bas ; le quiz prend tout l'écran. */
:root {
  --bg: #ECEEF3;
  --surface: #FFFFFF;
  --surface-2: #F5F6F9;
  --ink: #161A26;
  --muted: #5B6273;
  --line: #D6DAE3;
  --accent: #2B3A8C;
  --accent-ink: #FFFFFF;
  --good: #1F8A55;
  --warn: #B86E00;
  --bad: #C2353B;
  --s-logique: #3D63D9;
  --s-mecanique: #C9701A;
  --s-savoir: #24885A;
  --s-eloquence: #8147C9;
  --s-lucidite: #0B8794;
  --s-empathie: #C63E6E;
  --s-alchimie: #C2402F;
  --s-cosmos: #4F46B8;
  --s-etincelle: #9A7200;
  --s-sagesse: #8B5E34;
  --parchemin: #F3E9D2;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1120; --surface: #171B2C; --surface-2: #1E2336; --ink: #E9EBF3; --muted: #9AA1B6; --line: #2B3149;
    --accent: #9AA9FF; --accent-ink: #0E1120; --good: #4CC98A; --warn: #F0A43A; --bad: #FF6B70;
    --s-logique: #7E9BFF; --s-mecanique: #F0A55A; --s-savoir: #5CCB92; --s-eloquence: #B98CF5; --s-lucidite: #4FC6D2; --s-empathie: #F27BA4;
    --s-alchimie: #FF7F6E; --s-cosmos: #A49CFF; --s-etincelle: #F2C14E; --s-sagesse: #D9A66B; --parchemin: #E9DDC0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1120; --surface: #171B2C; --surface-2: #1E2336; --ink: #E9EBF3; --muted: #9AA1B6; --line: #2B3149;
  --accent: #9AA9FF; --accent-ink: #0E1120; --good: #4CC98A; --warn: #F0A43A; --bad: #FF6B70;
  --s-logique: #7E9BFF; --s-mecanique: #F0A55A; --s-savoir: #5CCB92; --s-eloquence: #B98CF5; --s-lucidite: #4FC6D2; --s-empathie: #F27BA4;
  --s-alchimie: #FF7F6E; --s-cosmos: #A49CFF; --s-etincelle: #F2C14E; --s-sagesse: #D9A66B; --parchemin: #E9DDC0;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.app { max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.vue { display: flex; flex-direction: column; gap: 18px; }
.entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.entete h1 { font-size: 30px; font-weight: 800; }
.entete .date { color: var(--muted); font-size: 14px; }

.bloc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bloc > h2 { font-size: 19px; font-weight: 700; }
.vide { color: var(--muted); }

/* Bandeau personnage */
.perso { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.perso .niv { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; }
.perso .niv small { font-size: 15px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
.perso p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.radar text { font-family: var(--f-body); }

/* Lignes de compétence */
.ligne { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.ligne .txt { flex: 1; min-width: 0; }
.ligne .txt strong { display: block; font-size: 16px; }
.ligne .txt span { font-size: 13px; color: var(--muted); }
.ligne .retard { color: var(--warn); font-weight: 700; }

.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); flex: none; min-height: 44px; }
.btn.sec { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.large { width: 100%; padding: 14px; font-size: 17px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.rangee { display: flex; gap: 8px; flex-wrap: wrap; }

.intro ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.intro li::marker { font-family: var(--f-mono); color: var(--muted); }

/* Arbre */
.branche { --c: var(--accent); }
.branche .tete { display: flex; align-items: center; gap: 10px; }
.branche .tete h2 { font-size: 20px; color: var(--c); }
.branche .tete .sous { color: var(--muted); font-size: 14px; }
.branche .tete .niveau { margin-left: auto; font-size: 13px; color: var(--muted); }
.diamant { position: relative; height: 300px; }
.diamant.double { height: 780px; }
.losange-plie { display: flex; flex-direction: column; gap: 4px; text-align: left; margin-top: 4px; padding: 12px 14px; border-radius: 12px;
  border: 2px dashed color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 5%, var(--surface)); color: var(--muted); }
.losange-plie b { font-size: 14px; line-height: 1.35; color: var(--ink); font-weight: 600; }
.diamant svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.diamant line { stroke: var(--line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.diamant line.ok { stroke: var(--c); }
.noeud { position: absolute; transform: translate(-50%, -50%); width: 46%; min-height: 64px; padding: 8px 10px; border-radius: 12px;
  border: 2px solid var(--c); background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 2px; }
.noeud b { font-size: 14px; line-height: 1.2; }
.noeud .etat { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.noeud.verrouillee { border-style: dashed; border-color: var(--line); color: var(--muted); }
.noeud.maitrisee, .noeud.a_reviser { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.noeud.maitrisee .etat { color: var(--ink); }
.noeud.a_reviser { box-shadow: 0 0 0 3px var(--warn); }
.noeud.a_reviser .etat { color: var(--warn); font-weight: 700; }
.noeud.gelee { border-style: dotted; }

/* Stats */
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; --c: var(--accent); }
.stat .nom { font-weight: 700; }
.stat .nom span { color: var(--muted); font-weight: 400; font-size: 14px; }
.stat .lv { font-family: var(--f-mono); font-weight: 700; color: var(--c); }
.jauge { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.jauge i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.stat .xp { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

/* Succès */
.succes { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.succes h3 { font-size: 17px; }
.succes .desc { font-size: 13px; color: var(--muted); }
.succes.verrou { opacity: 0.62; }
.succes blockquote { margin: 4px 0 0; padding-left: 12px; border-left: 3px solid var(--accent); font-size: 15px; }
.succes cite { font-style: normal; font-size: 12px; color: var(--muted); }

/* Onglets */
.onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.onglets .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.onglets button { border: 0; background: transparent; border-radius: 10px; padding: 6px 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; min-width: 0; }
.onglets button svg { width: 24px; height: 24px; }
.onglets button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.onglets .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; font-family: var(--f-mono); display: grid; place-items: center; padding: 0 4px; }

/* Feuille et quiz */
.voile { position: fixed; inset: 0; background: rgb(8 10 20 / 0.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.feuille { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 14px;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 90%; overflow-y: auto; }
.feuille h2 { font-size: 24px; }
.feuille .meta { color: var(--muted); font-size: 14px; }

.quiz { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; }
.quiz .in { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.quiz .haut { display: flex; align-items: center; gap: 12px; }
.quiz .haut .titre { flex: 1; min-width: 0; }
.quiz .haut .titre b { display: block; font-family: var(--f-display); font-size: 18px; }
.quiz .fermer { border: 0; background: var(--surface); border-radius: 999px; width: 44px; height: 44px; font-size: 22px; line-height: 1; }
.points { display: flex; gap: 6px; }
.points i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.points i.ok { background: var(--good); }
.points i.ko { background: var(--bad); }
.points i.cur { background: var(--c, var(--accent)); }
.chrono { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.chrono .barre { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.chrono .barre i { display: block; height: 100%; background: var(--c, var(--accent)); transition: width 0.25s linear; }
.chrono.urgent { color: var(--bad); } .chrono.urgent .barre i { background: var(--bad); }
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.interrupteur input { width: 52px; height: 30px; flex: none; accent-color: var(--accent); }
.enonce { font-family: var(--f-display); font-size: 23px; font-weight: 700; line-height: 1.25; }
.choix { display: flex; flex-direction: column; gap: 10px; }
.choix button { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; min-height: 52px; font-size: 17px; }
.choix button.bon { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.choix button.faux { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.choix button:disabled { cursor: default; color: var(--ink); }
.saisie { display: flex; gap: 10px; align-items: center; }
.saisie input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 20px; font-family: var(--f-mono); }
.saisie .unite { color: var(--muted); font-family: var(--f-mono); }
.retour { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-left: 5px solid var(--good); }
.retour.ko { border-left-color: var(--bad); }
.retour b { font-size: 16px; }
.bilan { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-top: 20px; }
.bilan .grand { font-family: var(--f-display); font-size: 34px; font-weight: 800; }
.bilan .score { font-family: var(--f-mono); font-size: 18px; color: var(--muted); }
.gain { font-family: var(--f-mono); font-weight: 700; }
.gain.plus { color: var(--good); } .gain.moins { color: var(--bad); }

textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px; font-family: var(--f-mono); font-size: 12px; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 16px; font-size: 14px; width: max-content; max-width: min(520px, calc(100% - 32px)); }
.horloge { font-size: 13px; color: var(--warn); font-weight: 700; }

/* Narrateur */
.comite { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px 12px 10px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-left: 5px solid var(--accent); text-align: left; }
.comite .masque { flex: none; width: 46px; height: 55px; border-radius: 10px; background: var(--parchemin); display: grid; place-items: center; overflow: hidden; }
.comite p { font-size: 15px; }
.comite .qui { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.comite .qui i { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; }
.comite.petit { padding: 10px 12px 10px 8px; }
.comite.petit .masque { width: 36px; height: 43px; }
.comite.petit p { font-size: 14px; }

/* Plateau */
.plateau svg.grille { display: block; width: 100%; height: auto; touch-action: manipulation; }
.grille-cadre svg.grille.libre { aspect-ratio: 2 / 3; touch-action: none; cursor: grab; border-radius: 12px; background: #1E1A2B; overscroll-behavior: contain; }
.grille-cadre { position: relative; user-select: none; -webkit-user-select: none; }
.grille-cadre .cam { position: absolute; right: 8px; bottom: 32px; display: flex; gap: 6px; }
.grille-cadre .cam button[data-cam="plus"], .grille-cadre .cam button[data-cam="moins"] { width: 38px; padding: 0; font-size: 20px; line-height: 1; }
.grille-cadre .cam button { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; min-height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); cursor: pointer; }
.plateau .tete { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.plateau .tete h2 { font-size: 19px; }
.plateau .tete .num { color: var(--muted); font-size: 13px; }
.case-act { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface-2); border: 0; text-align: left; width: 100%; }
.case-act .vitrine { width: 56px; height: 56px; }
.case-act b { display: block; font-size: 16px; line-height: 1.25; }
.case-act span { font-size: 13px; color: var(--muted); }
.etat-pion { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-left: 4px solid var(--warn); }
.bonus-jour { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.bonus-jour .pill { font-family: var(--f-mono); font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--c); color: #fff; flex: none; }
.bareme { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.bareme .num { text-align: right; font-weight: 700; }
#pion { transition: transform 0.17s ease-out; }
#pion.saut circle { animation: saut 0.19s ease-out; }
@keyframes saut { 50% { r: 18; } }
@media (prefers-reduced-motion: reduce) { #pion { transition: none; } #pion.saut circle { animation: none; } }
.plateau .halo { animation: halo 2.4s ease-in-out infinite; }
@keyframes halo { 50% { stroke-opacity: 0.12; } }
@media (prefers-reduced-motion: reduce) { .plateau .halo { animation: none; } }
.ton-tour { display: flex; flex-direction: column; gap: 8px; }
.ton-tour .tete h3 { font-size: 17px; }
.liste-epreuves { display: flex; flex-direction: column; gap: 8px; }
.epreuve { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; width: 100%; padding: 8px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); text-align: left; min-height: 56px; }
.epreuve .de { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--surface));
  border: 2px solid var(--c); box-shadow: inset -3px -3px 0 color-mix(in srgb, var(--c) 30%, transparent); }
.epreuve .de b { font-family: var(--f-mono); font-size: 16px; color: var(--ink); }
.epreuve .de.bonus { border-color: var(--good); }
.epreuve .txt strong { display: block; font-size: 15px; line-height: 1.25; }
.epreuve .txt span { font-size: 13px; color: var(--muted); }
.vaut { font-family: var(--f-mono); font-weight: 700; color: var(--ink); white-space: nowrap; }
.vaut.bonus { color: var(--good); }
.trajet { display: flex; flex-direction: column; gap: 6px; }
.trajet .pas { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.trajet .pas b { font-family: var(--f-mono); min-width: 54px; flex: none; }

/* Collections */
.segments { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.segments button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 700; font-size: 13px; padding: 0 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.segments button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
.filtres { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px; }
.filtres button { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; min-height: 34px; font-size: 13px; }
.filtres button[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); font-weight: 700; }
.frise { display: flex; flex-direction: column; }
.epoque-t { display: flex; align-items: center; gap: 10px; padding: 18px 0 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.epoque-t:first-child { padding-top: 4px; }
.epoque-t h3 { font-size: 17px; flex: 1; }
.epoque-t .num { font-size: 12px; color: var(--muted); }
.evt { display: grid; grid-template-columns: 84px 18px 1fr; align-items: stretch; border: 0; background: transparent; text-align: left; padding: 0; width: 100%; }
.evt .an { font-family: var(--f-mono); font-size: 12.5px; font-weight: 700; text-align: right; padding: 10px 0 0; line-height: 1.3; color: var(--ink); }
.evt .axe { position: relative; }
.evt .axe::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.evt .axe::after { content: ""; position: absolute; left: 3px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); }
.evt .corps { padding: 8px 4px 10px 6px; }
.evt .corps b { display: block; font-size: 15px; line-height: 1.3; }
.evt .corps span { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.4; }

  // --- Pixel art ------------------------------------------------------------
  // Une image = des lignes de caractères. Les pixels voisins de même couleur sont fusionnés en un rectangle.
  function pixels(grille, palette, couleurs, ox, oy, e, silhouette) {

        var fin = x; while (fin + 1 < ligne.length && ligne[fin + 1] === ch) fin++;

        x = fin + 1;

    return '<svg class="pix" viewBox="' + ox + " " + oy + " " + c + " " + c + '" width="' + taille + '" height="' + taille + '" aria-hidden="true">' + pixels(grille, palette, null, 0, 0, 1) + "</svg>";
  }

  // --- Narrateur ------------------------------------------------------------
  // L'IA parle derrière son masque du moment, dont l'expression suit le contexte de la réplique.
  // L'IA choisit elle-même son masque selon le ton de la réplique, et se sert parfois d'un objet ou d'un livre gagné.

  function comite(rep, petit) {

    var expr = rep.expression || M.expression(C, rep.contexte);
    var graine = (rep.id || tx(rep.texte).slice(0, 40)) + "|" + M.cleJour(maintenant()) + "|" + P.journal.length;
    var m = (rep.masque && C.ia.masques.filter(function (x) { return x.id === rep.masque; })[0]) || M.masquePourTon(C, P, expr, graine);
    var tenuIA = P.objetIA && C.objets.filter(function (o) { return o.id === P.objetIA; })[0];
    var b = el('<div class="comite' + (petit ? " petit" : "") + '"><span class="masque">' + (m ? svgMasque(m, expr, petit ? 34 : 44) : "") + (tenuIA ? '<span class="tenu-ia">' + svgObjet(tenuIA, false, petit ? 16 : 20) + "</span>" : "") + '</span><div><div class="qui"></div><p></p></div></div>');
    b.querySelector(".qui").innerHTML = esc(tx(C.narrateur) || "L'IA") + (m ? " <i>· " + esc(tx(m.nom)) + "</i>" : "");
    b.querySelector("p").textContent = tx(rep.texte);

      var vis = a.objet ? '<span class="vitrine">' + svgObjet(a.objet, false, 26) + "</span>" : '<span class="vitrine" style="background:' + a.livre.couleur + '">' + svgSprite(a.livre.embleme, 24) + "</span>";

  // Réplique fixe pour la journée dans un contexte, sans rien retenir dans la partie.

  // --- Sauvegarde -----------------------------------------------------------
  function lireLocal() {
    try { var s = localStorage.getItem(CLE_LOCALE); return s ? M.migrer(JSON.parse(s), C) : null; } catch (e) { return null; }
  }
  function sauver() {
    P.maj = Date.now() + (P.decalage || 0);
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(P)); } catch (e) {}
    planifierRoutine();
    if (stockage.ref) {
      clearTimeout(stockage.minuteur);
      stockage.minuteur = setTimeout(function () {
        stockage.ref.set(JSON.parse(JSON.stringify(P))).catch(function (e) {
          if (e && e.code === "unavailable") return;
          stockage.ref = null; stockage.etat = "Ce navigateur (le compte n'a pas accepté l'écriture)";
        });
      }, 600);
    }
  }
  function brancherCompte() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return null;
        var ref = db.doc("data/users/" + uid + "/partie");
        return ref.get().then(function (snap) {
          var distante = snap.exists ? M.migrer(snap.data(), C) : null;
          stockage.ref = ref; stockage.etat = "Ton compte Claude + ce navigateur";
          if (distante && (!P || distante.maj > P.maj)) { P = distante; try { localStorage.setItem(CLE_LOCALE, JSON.stringify(P)); } catch (e) {} rendre(); }
          else sauver();
          if (vue === "perso") rendre();

      });
    }).catch(function () {});
  }

  // --- Routine du matin (app Android) ---------------------------------------
  function routine() { return (P.options && P.options.routine) || null; }

    var h = +heure.slice(0, 2), m = +heure.slice(3, 5), t = maintenant(), out = [];
    var d = new Date(t); d.setHours(h, m, 0, 0);
    if (d.getTime() <= t) d.setDate(d.getDate() + 1);

    return out;

      var r = routine();
      LN.cancel({ notifications: IDS_ROUTINE.map(function (id) { return { id: id }; }) }).catch(function () {}).then(function () {
        if (!r || !r.active) return;
        // L'horloge du mode test décale les rappels ; les notifications, elles, suivent l'heure réelle.
        var decalage = P.decalage || 0;
        var notifs = prochainsMatins(r.heure, IDS_ROUTINE.length).map(function (date, i) {
          var t = date.getTime() + decalage, dus = M.rappelsDus(C, P, t).length, sug = M.suggestion(C, P, t);
          var corps = dus ? dus + " rappel" + (dus > 1 ? "s t'attendent" : " t'attend") + " ce matin." + (sug ? " Ensuite : " + tx(sug.nom) + "." : "")

        });

  // --- Plateau ----------------------------------------------------------------
  // v8 : une route sinueuse façon jeu de l'oie illustré. Six allers-retours ondulés reliés par des virages,
  // des cases multicolores numérotées, et un décor qui change avec l'humeur de l'IA.

      }

  function exporter() {
    var data = JSON.stringify(P, null, 1), nom = "arbre-des-savoirs-" + new Date().toISOString().slice(0, 10) + ".json";
    var montrer = function () {
      var z = document.getElementById("zone-export"); if (!z) return;
      z.innerHTML = '<p class="note">Le téléchargement n\'est pas possible ici. Copie ce texte et garde-le dans un fichier ; tu pourras le recoller plus bas.</p><textarea id="t-export" readonly></textarea><button type="button" class="btn sec">Copier</button>';
      z.querySelector("textarea").value = data;
      z.querySelector("button").onclick = function () {
        var ta = z.querySelector("textarea");
        try { navigator.clipboard.writeText(data).then(function () { toast("Copié"); }, function () { ta.select(); }); } catch (e) { ta.select(); }
      };
      ajouterCollage(z);
    };
    var FS = plugin("Filesystem"), SH = plugin("Share");
    if (FS && SH) {
      FS.writeFile({ path: nom, data: data, directory: "CACHE", encoding: "utf8" })
        .then(function (r) { return SH.share({ title: "Sauvegarde Arbre des savoirs", url: r.uri, dialogTitle: "Enregistrer ou envoyer la sauvegarde" }); })
        .catch(function (e) { if (!e || !/cancel/i.test(String(e.message || e))) montrer(); });
    } else if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) return montrer();
        return dl.save({ filename: nom, data: data }).then(function () { toast("Sauvegarde exportée"); }, function (e) { if (!e || e.code !== "declined") montrer(); });
      }).catch(montrer);
    } else montrer();
  }

      bt.onclick = function () { ouvrirObjet(o); };

  }

  // --- Vue Succès -----------------------------------------------------------
  function vueSucces() {
    var v = el('<div class="vue"></div>');
    var n = Object.keys(P.succes).length;
    v.appendChild(el('<div class="entete"><div><div class="eyebrow">Citations et anecdotes</div><h1>Succès</h1></div><div class="num" style="font-size:20px;font-weight:700">' + n + " / " + C.succes.length + "</div></div>"));
    var obtenus = C.succes.filter(function (s) { return P.succes[s.id]; }).sort(function (a, b) { return P.succes[b.id] - P.succes[a.id]; });
    var autres = C.succes.filter(function (s) { return !P.succes[s.id]; });
    var bloc = el('<div class="bloc"></div>');
    obtenus.forEach(function (s) { bloc.appendChild(carteSucces(s, true)); });
    autres.filter(function (s) { return !s.cache; }).forEach(function (s) { bloc.appendChild(carteSucces(s, false)); });
    var caches = autres.filter(function (s) { return s.cache; }).length;
    if (caches) bloc.appendChild(el('<div class="succes verrou"><h3>' + caches + " succès à découvrir</h3><p class=\"desc\">Ils sont cachés : chacun se révèle, avec sa citation ou son anecdote, au moment où tu l'obtiens.</p></div>"));
    v.appendChild(bloc);
    return v;
  }
  function conditionMasque(m) {
    var c = m.condition;
    if (!c) return "Dès le début";
    if (c.type === "succes_obtenus") return c.n + " succès";
    if (c.type === "succes") {
      var sc = C.succes.filter(function (x) { return x.id === c.id; })[0];
      if (sc && sc.condition.type === "tours_plateau") return sc.condition.n > 1 ? sc.condition.n + " tours du plateau" : "1 tour du plateau";
      return sc ? (P.succes[sc.id] || !sc.cache ? "Succès « " + tx(sc.nom) + " »" : "Un succès caché") : "Un succès";
    }
    return "Plus tard";
  }
  var TON_NOM = { neutre: "parler sans détour", moqueuse: "se moquer", impressionnee: "s'incliner", decue: "soupirer", impatiente: "s'impatienter" };
  function blocMasques(n) {
    var nb = C.ia.masques.filter(function (m) { return M.masqueDebloque(P, m.id); }).length;
    var b = el('<div class="bloc"><h2>Les masques de l\'IA</h2><p class="note">' + nb + " sur " + C.ia.masques.length + ". L'IA en gagne à mesure que tu obtiens des succès et que tu termines des tours du plateau. Elle choisit elle-même lequel porter, selon le ton de ce qu'elle a à te dire.</p><div class=\"masques\"></div></div>");
    var g = b.querySelector(".masques"), duJour = M.masquesDuJour(C, P, maintenant()).map(function (m) { return m.id; });
    C.ia.masques.forEach(function (m) {
      var ok = M.masqueDebloque(P, m.id), auj = duJour.indexOf(m.id) >= 0;
      var bt = el('<button type="button" class="m' + (ok ? "" : " verrou") + (auj ? " actuel" : "") + '"><span class="vitrine">' + svgMasque(m, "neutre", 52, !ok) + "</span><span>" + esc(ok ? tx(m.nom) : conditionMasque(m)) + "</span>" + (auj ? '<span class="jour-m">aujourd\'hui</span>' : "") + "</button>");
      bt.onclick = function () { ouvrirMasque(m, ok); };
      g.appendChild(bt);
    });
    return b;
  }
  function ouvrirMasque(m, ok) {
    var tons = (m.tons || []).map(function (x) { return TON_NOM[x]; }).filter(Boolean);
    var auj = M.masquesDuJour(C, P, maintenant()).some(function (x) { return x.id === m.id; });
    feuilleSimple('<div class="vitrine" style="padding:16px">' + svgMasque(m, ok ? (m.tons ? m.tons[0] : "moqueuse") : "neutre", 120, !ok) + "</div>" +
      (ok ? '<div class="eyebrow">Masque de l\'IA' + (auj ? " · porté aujourd'hui" : "") + "</div><h2>" + esc(tx(m.nom)) + badgeCar(m) + "</h2><p>" + esc(tx(m.notice)) + "</p>" +
          (m.texte_regles ? '<p class="etat-pion">' + esc(tx(m.texte_regles)) + "</p>" : "") +
          (tons.length ? '<p class="note">Elle le porte pour ' + esc(tons.length > 1 ? tons.slice(0, -1).join(", ") + " ou " + tons[tons.length - 1] : tons[0]) + ".</p>" : "") +
          '<p class="meta">Source : ' + esc(m.source) + "</p>"
        : "<h2>Masque à venir</h2><p class=\"meta\">Condition : " + esc(conditionMasque(m)) + ".</p>" + (m.texte_regles ? '<p class="note">Sa règle, le jour où elle le portera : ' + esc(tx(m.texte_regles)) + "</p>" : "")), ok ? tx(m.nom) : "Masque à venir");
  }
  // Médaille dessinée : ruban et disque, à la couleur d'accent ; grise tant que le succès n'est pas obtenu.
  function medaille(taille, gris) {
    var c = gris ? "var(--line)" : "#E0A800", f = gris ? "var(--surface-2)" : "#F6D365";
    return '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 2h5l3 9h-5zM23 2h-5l-3 9h5z" fill="' + (gris ? "var(--line)" : "var(--accent)") + '"/>' +
      '<circle cx="16" cy="20" r="10" fill="' + f + '" stroke="' + c + '" stroke-width="2"/><path d="M16 14.5l1.7 3.5 3.8.5-2.8 2.6.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.6 3.8-.5z" fill="' + (gris ? "var(--line)" : "#B07D00") + '"/></svg>';
  }
  function citationSucces(r) {
    return "<blockquote>" + (r.type === "citation" ? "« " + esc(tx(r.texte)) + " »" : esc(tx(r.texte))) + "</blockquote><cite>" + (r.auteur ? esc(r.auteur) + ", " : "") + esc(r.source) + "</cite>";
  }
  function carteSucces(s, obtenu) {
    if (!obtenu && s.cache) return el('<div class="succes verrou"><div class="tete-s">' + medaille(30, true) + '<div><h3>Succès caché</h3><p class="desc">Il se débloquera en jouant.</p></div></div></div>');
    var r = s.recompense;
    var html = '<div class="succes' + (obtenu ? "" : " verrou") + '"><div class="tete-s">' + medaille(30, !obtenu) + "<div><h3>" + esc(tx(s.nom)) + '</h3><p class="desc">' + esc(tx(s.description)) + (obtenu ? " · obtenu le " + dateCourte(P.succes[s.id]) : "") + "</p></div></div>";
    if (obtenu) html += "<details><summary>" + (r.type === "citation" ? "Lire la citation" : "Lire l'anecdote") + "</summary>" + citationSucces(r) + "</details>";
    return el(html + "</div>");
  }

  // --- Quiz -----------------------------------------------------------------
  // `opts.jouer` : lancé par le bouton « Jouer », l'IA a choisi l'épreuve (bonus de cases si réussie).
  function lancerQuiz(id, mode, opts) {
    var n = mode === "rappel" ? C.regles.rappels.questions_par_rappel : nbQuiz();
    var qs = M.tirerQuestions(C, P, id, n).map(function (q) {
      var ordre = q.type === "qcm" ? M.melanger(q.choix.map(function (_, i) { return i; }), Math.random) : null;
      return { q: q, ordre: ordre };
    });
    quiz = { id: id, mode: mode, jouer: !!(opts && opts.jouer), qs: qs, i: 0, res: [], repondu: false, fin: null, chrono: !!(P.options && P.options.chrono), minuteur: null, debut: Date.now(), debutQuestion: 0 };
    rendreQuiz();
  }
  function fermerQuiz() {
    var fini = quiz && quiz.fin;
    if (quiz) clearInterval(quiz.minuteur); quiz = null; var q = document.querySelector(".quiz"); if (q) q.remove();
    animPion = null;
    if (fini) { vue = "aujourdhui"; window.scrollTo(0, 0); }
    rendre();
  }

  function rendreQuiz() {
    var ancien = document.querySelector(".quiz"); if (ancien) ancien.remove();
    if (!quiz) return;
    var k = C.parId[quiz.id], s = stat(k.stat);
    var z = el('<div class="quiz" role="dialog" aria-modal="true" aria-label="' + (quiz.mode === "rappel" ? "Rappel" : "Quiz") + '" style="--c:' + couleur(k.stat) + '"><div class="in"></div></div>');
    var inn = z.querySelector(".in");
    if (quiz.fin) { inn.appendChild(bilan()); document.getElementById("couche").appendChild(z); z.querySelector("button").focus(); return; }
    var cur = quiz.qs[quiz.i], q = cur.q;
    var haut = el('<div class="haut"><div class="titre"><span class="eyebrow" style="color:' + couleur(k.stat) + '">' + (quiz.mode === "rappel" ? "Rappel" : "Quiz") + " · " + esc(tx(s.nom)) + "</span><b>" + esc(tx(k.nom)) + '</b></div><button type="button" class="fermer" aria-label="Quitter">×</button></div>');
    haut.querySelector(".fermer").onclick = function () {
      if (quiz.res.length && !quiz.fin) {
        var h = haut.querySelector(".titre"), avant = h.innerHTML, croix = haut.lastChild, retourCroix = croix.onclick;
        h.innerHTML = '<b>Quitter ?</b><span class="note">' + (quiz.mode === "rappel" ? "Le rappel restera à faire." : "Ce quiz ne comptera pas.") + "</span>";
        var oui = el('<button type="button" class="btn danger">Quitter</button>'); oui.onclick = fermerQuiz;
        haut.insertBefore(oui, croix);
        croix.setAttribute("aria-label", "Continuer le quiz");
        croix.onclick = function () { h.innerHTML = avant; oui.remove(); croix.setAttribute("aria-label", "Quitter"); croix.onclick = retourCroix; };
        return;
      }
      fermerQuiz();
    };
    inn.appendChild(haut);
    var pts = el('<div class="points" aria-label="Question ' + (quiz.i + 1) + " sur " + quiz.qs.length + '"></div>');
    quiz.qs.forEach(function (_, i) {
      var r = quiz.res[i];
      pts.appendChild(el("<i class=\"" + (r ? (r.correct ? "ok" : "ko") : (i === quiz.i ? "cur" : "")) + '"></i>'));
    });
    inn.appendChild(pts);
    inn.appendChild(el('<p class="enonce">' + esc(tx(q.enonce)) + "</p>"));
    // Les schémas viennent du contenu du jeu (data/questions.json), pas de l'utilisateur.
    if (q.illustration) inn.appendChild(el('<div class="illus">' + q.illustration + "</div>"));
    var barre = null;
    if (quiz.chrono) { barre = el('<div class="chrono" aria-live="off"><span class="num"></span><span class="barre"><i style="width:100%"></i></span></div>'); inn.appendChild(barre); }

    var zoneRep = el('<div class="choix"></div>');
    function repondre(valeur, bouton) {
      if (quiz.repondu) return;
      var ok = M.corriger(q, valeur);
      clearInterval(quiz.minuteur);
      quiz.repondu = true; quiz.res.push({ id: q.id, correct: ok, chrono: quiz.chrono, ms: Date.now() - quiz.debutQuestion, rep: valeur });
      zoneRep.querySelectorAll("button").forEach(function (b) {
        b.disabled = true;
        var v = b.getAttribute("data-v");
        if (v !== null && String(attendu()) === v) b.classList.add("bon");
      });
      if (bouton && !ok) bouton.classList.add("faux");
      var inp = zoneRep.querySelector("input"); if (inp) inp.disabled = true;
      montrerRetour(ok);
    }
    function attendu() { return q.type === "qcm" ? q.reponse : (q.type === "vrai_faux" ? q.reponse : q.reponse); }
    if (q.type === "qcm") {
      cur.ordre.forEach(function (i) {
        var b = el('<button type="button" data-v="' + i + '">' + esc(tx(q.choix[i])) + "</button>");
        b.onclick = function () { repondre(i, b); };
        zoneRep.appendChild(b);
      });
    } else if (q.type === "vrai_faux") {
      [true, false].forEach(function (v) {
        var b = el('<button type="button" data-v="' + v + '">' + (v ? "Vrai" : "Faux") + "</button>");
        b.onclick = function () { repondre(v, b); };
        zoneRep.appendChild(b);
      });
    } else {
      var f = el('<form class="saisie"><input id="saisie-num" inputmode="decimal" autocomplete="off" aria-label="Ta réponse" placeholder="Ta réponse">' + (q.unite ? '<span class="unite">' + esc(q.unite) + "</span>" : "") + '<button type="submit" class="btn">Valider</button></form>');
      f.onsubmit = function (ev) {
        ev.preventDefault();
        var val = f.querySelector("input").value;
        if (isNaN(M.lireNombre(val))) { toast("Écris un nombre, par exemple 42 ou 3,5."); return; }
        repondre(val, null);
        f.querySelector("button").disabled = true;
      };
      zoneRep.appendChild(f);
    }
    inn.appendChild(zoneRep);
    var zoneRetour = el("<div></div>"); inn.appendChild(zoneRetour);

    function montrerRetour(ok) {
      var rep = q.type === "qcm" ? tx(q.choix[q.reponse]) : (q.type === "vrai_faux" ? (q.reponse ? "Vrai" : "Faux") : String(q.reponse).replace(".", ",") + (q.unite ? " " + q.unite : ""));
      var tempsEcoule = quiz.tempsEcoule; quiz.tempsEcoule = false;
      zoneRetour.appendChild(el('<div class="retour' + (ok ? "" : " ko") + '"><b>' + (ok ? "Juste." + (quiz.chrono ? " +" + C.regles.chrono.bonus_xp_par_bonne_reponse + " XP de bonus chrono." : "") : (tempsEcoule ? "Temps écoulé. " : "Raté. ") + "Réponse : " + esc(rep) + ".") + "</b><p>" + esc(tx(q.explication)) + "</p>" +
        (q.illustration_explication ? '<div class="illus">' + q.illustration_explication + "</div>" : "") + "</div>"));
      if (M.estEclair(quiz.res[quiz.res.length - 1])) {
        var mot = comite(M.replique(C, P, ["eclair"]));
        if (mot) { zoneRetour.appendChild(el('<div style="height:10px"></div>')); zoneRetour.appendChild(mot); }
      }
      var dernier = quiz.i === quiz.qs.length - 1;
      var b = el('<button type="button" class="btn large">' + (dernier ? "Voir le résultat" : "Question suivante") + "</button>");
      b.onclick = function () {
        if (dernier) terminer(); else { quiz.i++; quiz.repondu = false; rendreQuiz(); }
      };
      zoneRetour.appendChild(el('<div style="height:12px"></div>'));
      zoneRetour.appendChild(b);
      b.focus();
    }
    document.getElementById("couche").appendChild(z);
    quiz.debutQuestion = Date.now();
    var focusable = z.querySelector(".choix button, .choix input"); if (focusable) focusable.focus();
    if (barre) {
      var duree = C.regles.chrono.secondes * 1000, debut = Date.now();
      var tic = function () {
        var reste = Math.max(0, duree - (Date.now() - debut));
        barre.querySelector(".num").textContent = Math.ceil(reste / 1000) + " s";
        barre.querySelector("i").style.width = (reste / duree * 100) + "%";
        barre.classList.toggle("urgent", reste <= 5000);
        if (reste <= 0) { quiz.tempsEcoule = true; repondre(q.type === "numerique" ? "" : -1, null); var fb = zoneRep.querySelector(".saisie button"); if (fb) fb.disabled = true; }
      };
      tic(); quiz.minuteur = setInterval(tic, 250);
    }
  }

  function terminer() {
    var t = maintenant();
    quiz.fin = quiz.mode === "rappel" ? M.terminerRappel(C, P, quiz.id, quiz.res, t, { jouer: quiz.jouer })
      : M.terminerQuiz(C, P, quiz.id, quiz.res, t, { duree: Date.now() - quiz.debut, jouer: quiz.jouer });
    quiz.fin.replique = M.replique(C, P, quiz.fin.contextes);
    // Le masque tout juste gagné, l'IA l'étrenne pour l'annoncer.
    if (quiz.fin.replique && quiz.fin.masque && quiz.fin.replique.contexte === "masque") quiz.fin.replique.masque = quiz.fin.masque.id;
    if (quiz.fin.farce) quiz.fin.repliqueFarce = M.replique(C, P, ["farce"], null, { deguisement: nomDeguisement(quiz.fin.farce) });
    var dep = quiz.fin.plateau;
    if (dep) {
      var ctx = dep.contextes.filter(function (c) { return c !== "plateau_avance"; });
      var recul = dep.etapes.filter(function (e) { return e.type === "recul" || e.type === "retour_epoque" || e.type === "teleport"; })[0];
      if (ctx.length) quiz.fin.repliquePlateau = M.replique(C, P, ctx, null, { n: recul ? recul.n : Math.abs(dep.a - dep.de) });
    }
    sauver(); rendreQuiz();
  }

  var NOM_ETAPE = {
    eureka: function (e) { return "Eurêka, case " + e.case + " : tu rejoues " + e.n + " cases."; },
    avance: function (e) { return "Raccourci, case " + e.case + " : +" + e.n + " cases."; },
    recul: function (e) { return e.cause === "cadeau" ? "L'IA fait reculer ton pion de " + e.n + " case" + (e.n > 1 ? "s" : "") + "." : e.cause === "echec" ? "Rappel raté : recul de " + e.n + " cases." : "Piège, case " + e.case + " : recul de " + e.n + " cases."; },
    retour_epoque: function (e) { return "Guillotine, case " + e.case + " : retour " + e.n + " cases en arrière."; },
    quarantaine: function (e) { return "Quarantaine : " + (e.n > 1 ? "tes " + e.n + " prochaines épreuves réussies" : "ta prochaine épreuve réussie") + " ne te feront pas avancer."; },
    prison: function (e) { return "Prison : plus un pas avant " + (e.n > 1 ? e.n + " quiz parfaits" : "un quiz parfait") + "."; },
    prison_reste: function () { return "Un quiz parfait de plus : encore un pour sortir."; },
    prison_liberation: function () { return "Quiz parfait : tu sors de prison."; },
    bloque_prison: function () { return "Assigné à résidence : ton pion ne bouge pas."; },
    bloque_quarantaine: function () { return "Quarantaine : cette épreuve ne fait pas avancer ton pion."; },
    tour_fini: function (e) { return "Arrivée ! Tour " + e.tour + " terminé : retour au feu, en plus dur."; },
    ennemi: function (e) { return "Case " + e.case + " : " + nomEn(C.ennemiParId[e.ennemi]) + " te barre la route. Gagne le duel pour faire les " + e.reste + " case" + (e.reste > 1 ? "s" : "") + " qui restent."; },
    cadeau: function (e) { return "Case cadeau " + e.case + " : un " + ({ objets: "objet", livres: "livre", accessoires: "accessoire", masques: "masque" }[e.famille] || "trésor") + " rejoint ta collection, sans épreuve."; },
    cadeau_vide: function (e) { return "Case cadeau " + e.case + " : le cabinet est vide pour ce tour. L'IA promet de se rattraper."; },
    teleport: function (e) { return "Téléportation, case " + e.case + " : retour à la case " + e.vers + "."; },
    revision: function (e) { return "Révision forcée, case " + e.case + " : l'IA veut revoir « " + tx(C.parId[e.comp].nom) + " ». Ton pion attend."; },
    revision_vide: function () { return "Révision forcée… mais tu ne maîtrises encore rien. L'IA soupire et te laisse passer."; },
    bloque_revision: function (e) { return "Révision forcée en attente (« " + tx(C.parId[e.comp].nom) + " ») : ton pion ne bouge pas."; },
    atome: function (e) { return "Case Mendeleïev " + e.case + " : un atome sauvage apparaît (" + tx(C.atomes.elements[e.z - 1].nom) + ")."; },
    atome_plein: function (e) { return "Case Mendeleïev " + e.case + " : trois atomes t'attendent déjà. Celui-ci repart, vexé."; },
    piege_evite: function (e) { return "Case " + e.case + " : le piège ne fonctionne pas aujourd'hui. Un masque de l'IA l'a désarmé."; },
    bonus_objet: function (e) { var o = C.objets.filter(function (x) { return x.id === e.objet; })[0], n = o ? tx(o.nom) : "Ton objet"; return e.bonus === "case" ? n + " te pousse : +" + e.n + " case" + (e.n > 1 ? "s" : "") + "." : e.bonus === "butin" ? n + " porte chance : la prochaine récompense est assurée." : n + " fait briller les yeux de l'IA : +" + e.n + " de faveur."; },
    duel_attente: function (e) { return tx(C.ennemiParId[e.ennemi].nom) + " te bloque toujours. Le duel reprend, pour " + e.reste + " case" + (e.reste > 1 ? "s" : "") + "."; },
  };
  function blocDeplacement(dep, rep, avecPlateau) {
    var d = dep.a - dep.de, fini = dep.etapes.some(function (e) { return e.type === "tour_fini"; });
    var titre = fini ? "Tour complet !" : d > 0 ? "Le pion avance de " + d + " case" + (d > 1 ? "s" : "") : d < 0 ? "Le pion recule de " + (-d) + " case" + (d < -1 ? "s" : "") : "Le pion reste sur place";
    var b = el('<div class="bloc plateau"><div class="tete"><h2>' + esc(titre) + '</h2><span class="num">case ' + dep.de + " → " + dep.a + '</span></div><div class="trajet"></div></div>');
    var tj = b.querySelector(".trajet"), v = dep.valeurs;
    if (avecPlateau) { animPion = dep.chemin && dep.chemin.length > 1 ? dep : null; var g = el('<div class="plateau-bilan">' + svgPlateau(true) + "</div>"); b.insertBefore(g, tj); }
    if (dep.valeur > 0 && (dep.cause === "cadeau" || dep.cause === "duel")) tj.appendChild(el('<div class="pas"><b>+' + dep.valeur + "</b><span>" + (dep.cause === "cadeau" ? "Cadeau de l'IA." : "Duel gagné : la fin du trajet.") + "</span></div>"));
    else if (dep.valeur > 0) tj.appendChild(el('<div class="pas"><b>+' + dep.valeur + "</b><span>Épreuve réussie" + (v && v.duJour ? ", bonus du jour compris" : "") +
      (dep.bonusJouer ? ", dont +" + dep.bonusJouer + " pour avoir laissé l'IA choisir" : dep.valeur > (v ? v.total : 0) ? ", avec bonus" : "") + ".</span></div>"));
    dep.etapes.forEach(function (e) { var f = NOM_ETAPE[e.type]; if (f) tj.appendChild(el('<div class="pas"><b>·</b><span>' + esc(f(e)) + "</span></div>")); });
    var k = C.plateau.cases[dep.a - 1];
    var act = el('<button type="button" class="case-act"><span class="vitrine">' + svgSprite(k.icone, 44) + '</span><span><span class="num">Case ' + k.n + " · " + esc(formatAnnee(k.annee)) + "</span><b>" + esc(tx(k.titre)) + "</b><span>" + esc(tx(k.replique)) + "</span></span></button>");
    act.onclick = function () { ouvrirCase(k.n); };
    b.appendChild(act);
    var m = comite(rep, true); if (m) b.appendChild(m);
    return b;
  }
  function bilan() {
    var r = quiz.fin, k = C.parId[quiz.id], s = stat(k.stat);
    var titre, texte, gain = "";
    if (quiz.mode === "quiz") {
      var besoin = Math.ceil(r.total * C.regles.quiz.seuil_maitrise);
      if (r.issue === "maitrisee") { titre = "Compétence maîtrisée"; texte = "Premier rappel " + dansJours(r.prochainRappel) + "."; gain = '<span class="gain plus">+' + r.xp + " XP " + esc(tx(s.nom)) + "</span>"; }
      else { titre = "Pas encore"; texte = "Il faut " + besoin + " bonnes réponses sur " + r.total + ". Les explications t'aideront pour le prochain essai."; }
    } else {
      if (r.revision && r.issue === "reussi") { titre = "Révision réussie"; texte = "Le souvenir tient. Prochain rappel le " + dateCourte(r.prochainRappel) + ", " + dansJours(r.prochainRappel) + ". Ton pion repart."; gain = '<span class="gain plus">+' + r.xp + " XP " + esc(tx(s.nom)) + "</span>"; }
      else if (r.issue === "revision_ratee") { titre = "Révision ratée"; texte = "Tu gardes la compétence, mais son rappel est dû dès maintenant. Réussis-le vite pour ne pas la perdre."; }
      else if (r.issue === "reussi") { titre = "Rappel réussi"; texte = "Prochain rappel le " + dateCourte(r.prochainRappel) + ", " + dansJours(r.prochainRappel) + "."; gain = '<span class="gain plus">+' + r.xp + " XP " + esc(tx(s.nom)) + "</span>"; }
      else { titre = "Compétence perdue"; texte = "Il fallait " + C.regles.rappels.bonnes_reponses_min + " bonnes réponses. Repasse le quiz complet pour la regagner."; gain = '<span class="gain moins">−' + r.xpPerdue + " XP " + esc(tx(s.nom)) + "</span>"; }
    }
    // v6 : trois temps, une chose à la fois. 1. le verdict et l'IA, 2. les récompenses une par une, 3. le pion qui avance.
    var recs = quiz.recs || (quiz.recs = recompensesBilan(r));
    var etapes = ["verdict"];
    recs.forEach(function (_, i) { etapes.push("recompense:" + i); });
    if (r.plateau) etapes.push("plateau");
    if (P.duel && P.duel.pret && r.plateau && r.plateau.etapes.some(function (x) { return x.type === "ennemi" || x.type === "duel_attente"; })) etapes.push("duel");
    var e = quiz.etape = Math.min(quiz.etape || 0, etapes.length - 1), nom = etapes[e], dernier = e === etapes.length - 1;
    var wrap = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');
    var tete = el('<div class="etapes-bilan"><span class="pts">' + etapes.map(function (_, i) { return '<i class="' + (i <= e ? "vu" : "") + '"></i>'; }).join("") + "</span></div>");
    if (!dernier) { var passer = el('<button type="button" class="passer">Passer</button>'); passer.onclick = function () { quiz.etape = etapes.length - 1; rendreQuiz(); }; tete.appendChild(passer); }
    wrap.appendChild(tete);
    var z = el('<div class="etape"></div>');
    if (nom === "verdict") {
      z.appendChild(el('<div class="bilan"><div class="eyebrow" style="color:' + couleur(k.stat) + '">' + esc(tx(k.nom)) + '</div><div class="grand">' + titre + '</div><div class="score">' + r.bonnes + " / " + r.total + "</div>" + gain + "<p>" + esc(texte) + "</p></div>"));
      var mot = comite(r.replique); if (mot) z.appendChild(mot);
    } else if (nom.indexOf("recompense:") === 0) {
      var c = recs[+nom.split(":")[1]]; c.classList.remove("anim"); void c.offsetWidth; c.classList.add("anim"); z.appendChild(c);
    } else if (nom === "duel") {
      z.appendChild(blocDefi());
    } else {
      z.appendChild(blocDeplacement(r.plateau, r.repliquePlateau, true));
    }
    wrap.appendChild(z);
    if (nom === "duel") return wrap;
    var suite = etapes[e + 1], libelle = !suite ? "Continuer" : suite === "plateau" ? "Voir le plateau" : suite === "duel" ? "Un ennemi !" : suite.indexOf("recompense:") === 0 ? (e === 0 ? (recs.length > 1 ? "Voir les " + recs.length + " récompenses" : "Voir la récompense") : "Récompense suivante") : "Suite";
    var bt = el('<button type="button" class="btn large">' + libelle + "</button>");
    bt.onclick = function () { if (!suite) fermerQuiz(); else { quiz.etape = e + 1; rendreQuiz(); } };
    wrap.appendChild(bt);
    // v12 : des réponses fausses ? L'IA les a épinglées au mur de la honte.
    var ratees = r.total - r.bonnes;
    // v14 : le mur s'ouvre par-dessus le bilan ; « ← Bilan » ramène à la même étape, pour voir la suite des récompenses.
    if (ratees > 0 && (nom === "verdict" || !suite)) {
      var bm = el('<button type="button" class="btn sec large">Le mur de la honte (' + ratees + ")</button>");
      bm.onclick = ouvrirHonteSurBilan;
      wrap.appendChild(bm);
    }
    if (nom === "verdict" && ratees > 0) z.appendChild(el('<p class="note" style="margin:0;text-align:center">' + ratees + " réponse" + (ratees > 1 ? "s" : "") + " fausse" + (ratees > 1 ? "s" : "") + " épinglée" + (ratees > 1 ? "s" : "") + " au mur de la honte, avec une fiche pour réviser.</p>"));
    if (nom === "plateau") setTimeout(function () { animerPion(z); }, 50);
    return wrap;
  }

  // v5 : les récompenses d'un bilan, une carte chacune, montrées une par une avec une petite animation.
  // Les textes longs (citation, notice) sont repliés derrière un appui.
  function carteRecompense(genre, visuel, titre, desc, plie, couleurEclats) {
    var b = el('<div class="recompense" style="--c:' + (couleurEclats || "#E0A800") + '"><div class="genre">' + esc(genre) + '</div><div class="badge-r">' + visuel + '</div><span class="eclats" aria-hidden="true"></span><h3></h3>' +
      (desc ? '<p class="desc"></p>' : "") + "</div>");
    b.querySelector("h3").textContent = titre;
    if (desc) b.querySelector(".desc").textContent = desc;
    var ec = b.querySelector(".eclats");
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * 2 * Math.PI, d = 60 + (i % 3) * 14;
      ec.appendChild(el('<i style="--x:' + Math.round(Math.cos(a) * d) + "px;--y:" + Math.round(Math.sin(a) * d) + "px;" + (i % 2 ? "background:var(--accent);" : "") + '"></i>'));
    }
    // Le texte (notice, anecdote, citation) est toujours déplié : pas de bouton à toucher pour le lire.
    if (plie) b.appendChild(el('<div class="deplie">' + plie.html + "</div>"));
    return b;
  }
  function recompensesBilan(r) {
    var out = [];
    (r.nouveauxSucces || []).forEach(function (sc) {
      var re = sc.recompense;
      out.push(carteRecompense("Succès débloqué", medaille(80), tx(sc.nom), tx(sc.description), { titre: re.type === "citation" ? "Lire la citation" : "Lire l'anecdote", html: citationSucces(re) }));
    });
    if (r.masque) {
      out.push(carteRecompense("L'IA gagne un masque", svgMasque(r.masque, "moqueuse", 72), tx(r.masque.nom), "Elle le portera quand le ton s'y prête.", { titre: "Son histoire", html: "<p>" + esc(tx(r.masque.notice)) + "</p>" }, "var(--accent)"));
    }
    (r.nouveauxObjets || []).forEach(function (o) {
      out.push(carteRecompense("Nouvel objet au cabinet", svgObjet(o, false, 80), tx(o.nom), "", { titre: "Lire la notice", html: "<p>" + esc(tx(o.notice)) + '</p><cite>Source : ' + esc(o.source) + "</cite>" }));
    });
    (r.nouveauxLivres || []).forEach(function (l) {
      var c = carteRecompense("Nouveau livre à la bibliothèque", '<span class="vitrine" style="padding:8px;background:' + l.couleur + ';border-radius:12px">' + svgSprite(l.embleme, 64) + "</span>", tx(l.titre), l.auteur + ", " + formatAnnee(l.annee), null, l.couleur);
      var bt = el('<button type="button" class="btn">Ouvrir le livre</button>'); bt.onclick = function () { ouvrirLivre(l, true); };
      c.appendChild(bt); out.push(c);
    });
    (r.nouveauxSavants || []).forEach(function (sv) {
      out.push(carteRecompense("Nouveau savant jouable", svgSavant(sv, 80), tx(sv.nom), sv.annees + ". À incarner dans l'onglet Personnage.", null));
    });
    (r.nouveauxAccessoires || []).forEach(function (a) {
      out.push(carteRecompense("Nouvel accessoire", svgRogne(a.pixels, C.avatar.palette, 80), tx(a.nom), "À essayer sur ton avatar, dans l'onglet Personnage.", null));
    });
    if (r.farce) {
      var cfa = carteRecompense("Farce de l'IA", '<span class="avatar-cadre">' + svgAvatar(80) + "</span>", "Nouveau look", "Jusqu'à demain. L'IA décide, pas de recours.", null, "var(--warn)");
      var m = comite(r.repliqueFarce, true); if (m) { m.style.width = "100%"; cfa.appendChild(m); }
      out.push(cfa);
    }
    return out;
  }
  // --- Boucle ---------------------------------------------------------------
  function rendre() {
    if (!C || !P) return;
    var app = document.getElementById("app"); app.innerHTML = "";
    app.appendChild(vue === "arbre" ? vueArbre() : vue === "perso" ? vuePerso() : vue === "collections" ? vueCollections() : vue === "succes" ? vueSucces() : vue === "honte" ? vueHonte() : vueAujourdhui());
    rendreOnglets();
  }

  function charger(nom) { return fetch("data/" + nom).then(function (r) { if (!r.ok) throw new Error(nom); return r.json(); }); }

  function visite() {
    var a = M.noterVisite(C, P, maintenant()), b = M.verifierRecompenses(C, P, maintenant());
    if (C.plateau) M.bonusDuJour(C, P, maintenant());
    if (C.ia && C.ia.faveur) M.piegeIA(C, P, maintenant());
    if (C.ia && C.ia.masques_jour) M.masquesDuJour(C, P, maintenant());
    sauver();
  }

  var FICHIERS = ["regles.json", "skills.json", "questions.json", "succes.json", "commentaires.json", "objets.json", "avatar.json",
    "ia.json", "plateau.json", "frise.json", "bibliotheque.json", "ennemis.json", "atomes.json"];
  Promise.all(FICHIERS.map(charger)).then(function (d) {
    C = M.indexerContenu(d[0], d[1], d[2], d[3], { commentaires: d[4], objets: d[5], avatar: d[6], ia: d[7], plateau: d[8], frise: d[9], bibliotheque: d[10], ennemis: d[11], atomes: d[12] });
    P = lireLocal() || M.nouvellePartie(Date.now());
    visite();
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(P)); } catch (e) {}
    rendre();
    if (NATIF) {
      var LN = plugin("LocalNotifications");
      if (LN) LN.addListener("localNotificationActionPerformed", function () { fermerFeuille(); vue = "aujourdhui"; rendre(); window.scrollTo(0, 0); });
      planifierRoutine();
      // Au retour dans l'app, la date a pu changer : on recalcule l'écran et les notifications.
      document.addEventListener("visibilitychange", function () { if (!document.hidden && !quiz) { visite(); rendre(); planifierRoutine(); } });
    } else brancherCompte();
  }).catch(function () {
    document.getElementById("app").innerHTML = '<div class="vue"><div class="entete"><h1>Arbre des savoirs</h1></div><div class="bloc"><p>Les fichiers de compétences n\'ont pas pu être chargés. Recharge la page.</p></div></div>';
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (feuille) fermerFeuille(); } });
})();
</script>
