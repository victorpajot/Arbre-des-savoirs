# Fabrique le bundle AAB pour Google Play, séparé du workflow APK pour ne pas ralentir les tests.
# - Lancé à la main (onglet Actions > Google Play > Run workflow) : AAB signé avec la clé d'envoi,
#   à télécharger en bas de la page du run puis à déposer dans la Play Console.
# - Sur une pull request qui touche l'app : compile l'AAB (non signé) et l'APK de test pour vérifier que tout passe.
name: Google Play

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "web/**"
      - ".github/workflows/play.yml"

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le numéro de version Play = nombre de commits, qui ne redescend jamais.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Valider le contenu et les règles
        run: |
          pip install jsonschema
          python3 outils/valider.py
          node outils/test_moteur.js
          python3 outils/verifier_sources.py

      - name: Assembler la page dans l'app
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Clé d'envoi Play
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_KEYSTORE_BASE64" ]; then
            echo "::error::Secret PLAY_KEYSTORE_BASE64 absent : voir play/GUIDE.md, étape « Clé d'envoi »."
            exit 1
          fi
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play.keystore"
          echo "PLAY_KEYSTORE=$RUNNER_TEMP/play.keystore" >> "$GITHUB_ENV"

      - name: Compiler l'AAB (et l'APK de test sur une pull request)
        working-directory: mobile/android
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$(git rev-list --count HEAD)
          echo "versionCode $VERSION_CODE"
          taches="bundleRelease"
          if [ "${{ github.event_name }}" = "pull_request" ]; then taches="bundleRelease assembleDebug"; fi
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew $taches --no-daemon --stacktrace 2>&1 | tee gradle.log; then
            grep -E -A2 "What went wrong|Where:|Caused by|error:|Could not|build.gradle" gradle.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Vérifier la signature
        if: github.event_name == 'workflow_dispatch'
        run: jarsigner -verify mobile/android/app/build/outputs/bundle/release/app-release.aab | grep "jar verified"

      - name: Joindre l'AAB au run
        uses: actions/upload-artifact@v4
        with:
          name: arbre-des-savoirs-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Joindre l'APK de test au run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: arbre-des-savoirs-apk-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
