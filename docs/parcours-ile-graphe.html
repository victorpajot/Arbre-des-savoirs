<title>Parcours de l'île</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Une carte qu'on parcourt : le graphe prend l'écran, la fiche de la sélection reste à côté (dessous sur téléphone). */
:root {
  --fond: #EEF3F4; --toile: #F8FBFB; --encre: #14262D; --doux: #5A6F77; --trait: #C9D6DA; --carte: #FFFFFF; --bande: #E4ECEE;
  --age: #14262D; --age-t: #FFFFFF; --besoin: #B7791F; --savoir: #2563A8; --amen: #2F7D4F; --epreuve: #C2452D; --grotte: #6B4BA3;
  --titre: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --texte: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fond: #0F1A1F; --toile: #13222A; --encre: #E8F0F2; --doux: #9DB0B7; --trait: #2C4049; --carte: #1A2C35; --bande: #182830;
  --age: #E8F0F2; --age-t: #0F1A1F; --besoin: #E0A94A; --savoir: #6FA8E6; --amen: #62B985; --epreuve: #F08468; --grotte: #A98BE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --fond: #0F1A1F; --toile: #13222A; --encre: #E8F0F2; --doux: #9DB0B7; --trait: #2C4049; --carte: #1A2C35; --bande: #182830;
  --age: #E8F0F2; --age-t: #0F1A1F; --besoin: #E0A94A; --savoir: #6FA8E6; --amen: #62B985; --epreuve: #F08468; --grotte: #A98BE0; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--fond); color: var(--encre); font-family: var(--texte); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--titre); font-size: 22px; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--doux); font-size: 14px; }
.barre { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.barre button { font: 500 14px var(--texte); color: var(--encre); background: var(--carte); border: 1px solid var(--trait); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.barre button:hover { border-color: var(--doux); } .barre button:focus-visible, .fiche button:focus-visible { outline: 2px solid var(--savoir); outline-offset: 2px; }
.barre .sep { width: 1px; height: 22px; background: var(--trait); margin: 0 4px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--doux); }
.legende i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 12px; }
.toile { position: relative; min-height: 0; background: var(--toile); border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.toile svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.toile svg.tire { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--trait); background: var(--carte); color: var(--encre); font: 600 18px var(--texte); cursor: pointer; }
.fiche { min-height: 0; min-width: 0; overflow-y: auto; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 16px; }
.fiche .genre { font: 600 12px var(--texte); letter-spacing: .08em; text-transform: uppercase; }
.fiche h2 { font-family: var(--titre); font-size: 21px; line-height: 1.2; margin: 4px 0 12px; text-wrap: balance; }
.fiche h3 { font: 600 13px var(--texte); color: var(--doux); margin: 14px 0 3px; }
.fiche p { margin: 0; } .fiche ul { margin: 0; padding-left: 18px; } .fiche li { margin: 2px 0; }
.fiche .liens { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.fiche .liens button { text-align: left; font: 400 14px var(--texte); color: var(--encre); background: var(--toile); border: 1px solid var(--trait); border-left-width: 4px; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.fiche .liens button small { display: block; color: var(--doux); font-size: 12px; }
.bande { fill: var(--bande); } .bande-nom { font: 700 26px var(--titre); fill: var(--doux); opacity: .55; }
.n rect { fill: var(--carte); stroke-width: 2; } .n text { font: 500 13px var(--texte); fill: var(--encre); pointer-events: none; }
.n { cursor: pointer; } .n.age rect { fill: var(--age); stroke: var(--age); } .n.age text { fill: var(--age-t); font: 700 17px var(--titre); }
.n.besoin rect { stroke: var(--besoin); } .n.savoir rect { stroke: var(--savoir); } .n.amen rect { stroke: var(--amen); } .n.epreuve rect { stroke: var(--epreuve); } .n.grotte rect { stroke: var(--grotte); }
.n .pastille { stroke: none; } .n.besoin .pastille { fill: var(--besoin); } .n.savoir .pastille { fill: var(--savoir); } .n.amen .pastille { fill: var(--amen); } .n.epreuve .pastille { fill: var(--epreuve); } .n.grotte .pastille { fill: var(--grotte); }
.l path.vu { fill: none; stroke: var(--doux); stroke-width: 1.6; opacity: .55; } .l path.prise { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.l.porte path.vu { stroke: var(--age); stroke-width: 3; opacity: .8; } .l.passage path.vu { stroke: var(--grotte); stroke-dasharray: 6 5; opacity: .85; } .l.garde path.vu { stroke: var(--epreuve); } .l.permet path.vu { stroke: var(--amen); } .l.couvre path.vu { stroke: var(--besoin); }
.l:hover path.vu { opacity: 1; stroke-width: 3; }
svg.choix .n, svg.choix .l { opacity: .22; } svg.choix .n.on, svg.choix .l.on { opacity: 1; }
.n.sel rect { stroke-width: 4; } .l.sel path.vu { stroke-width: 4.5; opacity: 1; }
@media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 54fr) minmax(0, 46fr); } h1 { font-size: 19px; } header p, .legende { display: none; } .barre button { padding: 5px 10px; font-size: 13px; } }
@media (prefers-reduced-motion: no-preference) { .n, .l { transition: opacity .15s; } }
</style>
<header><h1>Le parcours de l'île</h1><p>Touche un nœud ou un lien pour lire sa fiche. Généré depuis les données du jeu.</p></header>

<script>
(function () {
  var G = {"noeuds": [{"id": "age:survivants", "genre": "age", "nom": "Les survivants", "x": 0, "y": 0, "l": 390, "h": 46, "fiche": [["Ce que vit le joueur", "Quelques survivants éparpillés sur l'île. Ils n'ont pas encore allumé de feu."], ["Pour passer à : le campement", ["1 besoin couvert (hors optionnels)", "l'épreuve « Faire du feu »"]], ["Habitants au plus", "15"], ["Rien d'après", "l'an -3000 : visiteurs et achats d'Alyca ne dépassent pas cette date"]]}, {"id": "besoin:survivants:survivre", "genre": "besoin", "nom": "Survivre", "x": 0, "y": 100, "l": 176, "h": 46, "fiche": [["Âge", "Les survivants"], ["Pourquoi", "Se chauffer, cuire, veiller ensemble : tout commence par le feu."], ["Savoirs qui y répondent (un seul suffit)", ["Maîtriser le feu"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:ile.feu", "genre": "savoir", "nom": "Maîtriser le feu", "x": 214, "y": 100, "l": 176, "h": 46, "fiche": [["Arbre", "Le foyer"], ["De quoi il s'agit", "Garder un feu, puis savoir l'allumer : les plus anciennes traces, la cuisson, le foyer."], ["S'apprend à l'âge", "Les survivants"]]}, {"id": "epreuve:feu", "genre": "epreuve", "nom": "Faire du feu", "x": 642, "y": 0, "l": 176, "h": 46, "fiche": [["Rôle", "Porte vers l'âge suivant : le campement. Elle n'apparaît qu'une fois les autres conditions réunies."], ["En deux mots", "Tu sais comment on fait. Reste à le faire : un silex, un nodule de pyrite, et trois gestes."], ["Quête avant l'épreuve", "De quoi faire du feu. Avant de frapper, il faut de quoi frapper. Quatre choses t'attendent quelque part sur l'île : explore-la de près et touche-les pour les ramasser."], ["À trouver sur l'île", ["Un silex, au bord de la rivière, vers le sud", "De la pyrite, au pied du volcan, côté ouest", "De l'amadou, dans le bois, à l'ouest", "Des branchages, dans les arbres du nord-est"]], ["Gestes", ["L'arrachement : Frappe la pyrite avec le silex, vite et sans t'arrêter : chaque coup franc arrache un éclat.", "L'énergie d'activation : Arrête la jauge au-dessus du trait : sous 70 kJ par mole, la réaction ne démarre pas.", "L'oxydation : Le grain chaud rencontre le dioxygène de l'air. Rien ne se perd : il faut autant de billes de chaque couleur à gauche et à droite."]], ["Ce qu'on en retient", "Une étincelle ne fait pas un feu. On la recueille sur de l'amadou, la matière ouatée d'un champignon, l'amadouvier : il s'embrase facilement au contact des étincelles, mais ne fournit qu'une braise."], ["Source", "Bertrand Roussel, « La longue histoire de la production du feu », Hominidés.com (exposition du musée de Terra Amata)"]]}, {"id": "age:campement", "genre": "age", "nom": "Le campement", "x": 900, "y": 0, "l": 390, "h": 46, "fiche": [["Ce que vit le joueur", "Le feu a réuni quelques survivants. De petites bandes vivent de cueillette, de chasse et de pêche, sans rien bâtir de durable."], ["Pour passer à : le village", ["6 besoins couverts (hors optionnels)", "10 habitants sur l'île", "le passage par la grotte ornée", "l'épreuve « Dresser le sanctuaire »"]], ["Habitants au plus", "40"], ["Rien d'après", "l'an -3000 : visiteurs et achats d'Alyca ne dépassent pas cette date"]]}, {"id": "besoin:campement:ciel", "genre": "besoin", "nom": "Lire le ciel", "x": 900, "y": 100, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "Les saisons reviennent : qui suit le ciel sait quand cueillir, chasser ou partir."], ["Savoirs qui y répondent (un seul suffit)", ["Le ciel des premiers peuples"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:astro.nebra", "genre": "savoir", "nom": "Le ciel des premiers peuples", "x": 1114, "y": 100, "l": 176, "h": 46, "fiche": [["Arbre", "Cosmos"], ["De quoi il s'agit", "Cercle de Goseck, Stonehenge, disque de Nebra, Pléiades d'Hésiode : bien avant les traités d'astronomie, on lit le ciel pour suivre l'année."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "besoin:campement:soigner", "genre": "besoin", "nom": "Soigner", "x": 900, "y": 174, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "Les plantes, les gestes et ceux qui les connaissent."], ["Savoirs qui y répondent (un seul suffit)", ["Soigner avant la science"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:sci.soigner", "genre": "savoir", "nom": "Soigner avant la science", "x": 1114, "y": 174, "l": 176, "h": 46, "fiche": [["Arbre", "Savoir"], ["De quoi il s'agit", "Un Néandertal soigné par les siens, des crânes percés et guéris, un homme des glaces tatoué : la médecine est plus vieille que l'écriture."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "besoin:campement:menager", "genre": "besoin", "nom": "Vivre de l'île", "x": 900, "y": 248, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "La forêt et les poissons ne sont pas sans fin."], ["Savoirs qui y répondent (un seul suffit)", ["Vivre de ce que l'île donne"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:res.cueillir", "genre": "savoir", "nom": "Vivre de ce que l'île donne", "x": 1114, "y": 248, "l": 176, "h": 46, "fiche": [["Arbre", "Ressources"], ["De quoi il s'agit", "Prélever sans vider : des moas exterminés en un siècle aux bassins à anguilles, aux jardins de palourdes et aux interdits de pêche."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "besoin:campement:temps", "genre": "besoin", "nom": "Voir venir le temps", "x": 900, "y": 322, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "Un abri de branches ne tient pas sous l'orage : mieux vaut le voir venir."], ["Savoirs qui y répondent (un seul suffit)", ["Lire le ciel"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:meteo.ciel", "genre": "savoir", "nom": "Lire le ciel", "x": 1114, "y": 322, "l": 176, "h": 46, "fiche": [["Arbre", "Météo"], ["De quoi il s'agit", "Avant tout instrument : le ciel rouge, le halo, les grenouilles, les grues et l'étoile de la crue."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "besoin:campement:souvenir", "genre": "besoin", "nom": "Se souvenir", "x": 900, "y": 396, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "Sans écriture, tout ce que le groupe sait tient dans les têtes."], ["Savoirs qui y répondent (un seul suffit)", ["Retenir sans écrire"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:mnemo.sansecrire", "genre": "savoir", "nom": "Retenir sans écrire", "x": 1114, "y": 396, "l": 176, "h": 46, "fiche": [["Arbre", "Mnémosyne"], ["De quoi il s'agit", "Des planches de perles du Congo aux chants qui traversent l'Australie : avant l'écriture, et à côté d'elle, la mémoire s'accroche à des objets et à des chemins."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "besoin:campement:ensemble", "genre": "besoin", "nom": "Veiller ensemble", "x": 900, "y": 470, "l": 176, "h": 46, "fiche": [["Âge", "Le campement"], ["Pourquoi", "Autour du feu, on chante, on rit, on apprend à se comprendre."], ["Savoirs qui y répondent (un seul suffit)", ["Les premiers instruments", "Les émotions, d'Aristote à nous"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:mus.instruments", "genre": "savoir", "nom": "Les premiers instruments", "x": 1114, "y": 470, "l": 176, "h": 46, "fiche": [["Arbre", "Harmonie"], ["De quoi il s'agit", "Des flûtes taillées dans des os il y a 40 000 ans aux lyres d'or d'Ur : la musique est bien plus vieille que l'écriture."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "savoir:psy.emotions", "genre": "savoir", "nom": "Les émotions, d'Aristote à nous", "x": 1114, "y": 530, "l": 176, "h": 46, "fiche": [["Arbre", "Empathie"], ["De quoi il s'agit", "Aristote range les émotions par paires, Sénèque veut détruire la colère ; aujourd'hui, on apprend à les nommer et à les réévaluer."], ["S'apprend à l'âge", "Le campement"]]}, {"id": "amen:foyer", "genre": "amen", "nom": "Abri de branches", "x": 1328, "y": 100, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des branches et des peaux tendues près du feu. Dix habitants de plus y dorment au sec."], ["Quartier", "La ville"], ["Possible à partir de", "Le campement"], ["Savoir requis", ["Maîtriser le feu"]], ["Coût", "5 bois"], ["Loge", "10 habitants"], ["Épreuve à réussir avant de bâtir", "Monter l'abri"]]}, {"id": "epreuve:abri", "genre": "epreuve", "nom": "Monter l'abri", "x": 1542, "y": 100, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Abri de branches » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le feu réchauffe, il ne protège pas de la pluie. Il faut une charpente qui tienne au vent, des peaux prêtes à servir, et de quoi les retenir. Trois étapes, et à chacune c'est toi qui décides."], ["Quête avant l'épreuve", "De quoi s'abriter. Pas d'abri sans charpente ni couverture. Il te faut de longues perches, des pierres pour le muret, et des peaux de bêtes. Les peaux ne se ramassent pas : il faut abattre un bison, ou un prédateur si tu oses. Explore l'île."], ["À trouver sur l'île", ["De longues perches, à la lisière du bois, à l'ouest", "Des pierres et des galets, sur la côte ouest", "Des peaux de bêtes (sur une bête abattue)"]], ["Gestes", ["La charpente : L'abri se monte ici en coupe, pièce après pièce. À chaque pièce, choisis : un mauvais choix ne tient pas, et tu sauras pourquoi.", "Les peaux : Une peau ne devient pas une couverture toute seule. Touche les outils dans l'ordre où ils servent, de la bête à la couture.", "La couverture : La charpente est debout, les peaux sont prêtes. Reste à couvrir, et à faire tenir la couverture."]], ["Ce qu'on en retient", "Chacune de ces cabanes pouvait abriter entre quinze et vingt hominidés. On retrouve généralement un foyer installé en son centre."], ["Source", "Hominidés.com, « L'habitat au Paléolithique »"]]}, {"id": "amen:hutte", "genre": "amen", "nom": "Hutte du soigneur", "x": 1328, "y": 174, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des plantes qui sèchent et quelqu'un qui sait s'en servir. Chaque hutte fait reculer les décès d'un cinquième."], ["Quartier", "Les champs et jardins"], ["Possible à partir de", "Le campement"], ["Savoir requis", ["Soigner avant la science"]], ["Coût", "30 crédits, 5 bois"], ["Épreuve à réussir avant de bâtir", "Garnir la hutte"]]}, {"id": "epreuve:remede", "genre": "epreuve", "nom": "Garnir la hutte", "x": 1542, "y": 174, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Hutte du soigneur » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Soigner, ce n'est pas réciter une formule au-dessus du malade. C'est savoir quoi cueillir, et comment le garder. Deux gestes."], ["Quête avant l'épreuve", "De quoi soigner. Pas de soigneur sans remèdes. Il te faut un champignon qui pousse sur les bouleaux, et de l'écorce de peuplier. Les lanières de cuir, tu les as déjà au camp : explore l'île."], ["À trouver sur l'île", ["Un champignon du bouleau, dans le bois, à l'ouest", "De l'écorce de peuplier, près du lac, au sud-ouest"]], ["Gestes", ["Les lanières : Coupe le champignon en morceaux et enfile-les sur une lanière de cuir : pose le doigt sur le 1 et passe par chaque morceau, dans l'ordre.", "Le remède : Écrase l'écorce de peuplier sous la pierre, d'avant en arrière, jusqu'à en faire une pâte."]], ["Ce qu'on en retient", "On prête au polypore du bouleau bien des usages : soulager la douleur, panser les plaies, désinfecter."], ["Source", "The Conversation, « Nature's first aid kit: a fungus growing on the side of birch trees »"]]}, {"id": "amen:veillee", "genre": "amen", "nom": "Cercle de la veillée", "x": 1328, "y": 396, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des pierres en rond où les anciens racontent. Un savant de plus passe chaque jour, et l'île attire un peu plus de monde."], ["Quartier", "L'agora"], ["Possible à partir de", "Le campement"], ["Savoir requis (un au choix)", ["Retenir sans écrire", "Les premiers instruments", "Les émotions, d'Aristote à nous"]], ["Coût", "20 crédits, 5 bois"]]}, {"id": "amen:reserve", "genre": "amen", "nom": "Réserve de pêche", "x": 1328, "y": 456, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une anse où personne ne pêche, marquée d'un poteau. Les bancs de poissons se refont moitié plus vite."], ["Quartier", "Le port"], ["Possible à partir de", "Le campement"], ["Savoir requis", ["Vivre de ce que l'île donne"]], ["Coût", "25 crédits"]]}, {"id": "amen:guet", "genre": "amen", "nom": "Poste de guet", "x": 1328, "y": 516, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une plate-forme d'où quelqu'un lit le ciel matin et soir. Les aléas sont annoncés plus souvent."], ["Quartier", "Le port"], ["Possible à partir de", "Le campement"], ["Savoir requis", ["Lire le ciel"]], ["Coût", "25 crédits, 5 bois"]]}, {"id": "epreuve:sanctuaire", "genre": "epreuve", "nom": "Dresser le sanctuaire", "x": 1542, "y": 0, "l": 176, "h": 46, "fiche": [["Rôle", "Porte vers l'âge suivant : le village. Elle n'apparaît qu'une fois les autres conditions réunies."], ["En deux mots", "Une histoire court d'un feu à l'autre, et tout le monde veut la voir dans la pierre. Tailler, graver, dresser : trois gestes, et beaucoup de bras."], ["Quête avant l'épreuve", "De quoi dresser un sanctuaire. Les bandes de l'île se racontent la même histoire, et veulent un lieu pour elle. Il te faut des pics de silex pour tailler la pierre, de longues perches pour la lever, et un banc de calcaire assez grand : explore l'île de près."], ["À trouver sur l'île", ["Des pics de silex, au bord de la rivière, vers le sud", "De longues perches, à la lisière du bois, à l'ouest", "Un banc de calcaire, sur la côte est, au sud du camp"]], ["Gestes", ["Le pilier : Dégage le pilier du banc de calcaire : frappe au pic de silex, vite et sans t'arrêter.", "Le renard : Grave l'animal de l'histoire sur le pilier : pose le doigt sur le 1 et suis les points dans l'ordre, du museau à la queue.", "Debout : Le pilier est couché. Glisse les perches dessous et pèse dessus, encore et encore, tous ensemble, jusqu'à le mettre debout."]], ["Ce qu'on en retient", "Pour Klaus Schmidt, qui a fouillé Göbekli Tepe, des nomades s'y retrouvaient pour bâtir, attirés par des festins, et c'est ce travail en commun qui les aurait poussés à domestiquer plantes et animaux : « D'abord le temple, ensuite la ville. » Depuis, les fouilles ont livré des foyers, des habitations et plus de 8 000 outils de mouture. Le lieu était sans doute habité, et la question reste débattue."], ["Source", "Andrew Curry, « Last Stand of the Hunter-Gatherers? », Archaeology Magazine, mai-juin 2021"]]}, {"id": "age:village", "genre": "age", "nom": "Le village", "x": 1800, "y": 0, "l": 390, "h": 46, "fiche": [["Ce que vit le joueur", "Le sanctuaire a rassemblé les bandes au même endroit : il faut maintenant nourrir, loger et organiser tout ce monde."], ["Pour passer à : la cité", ["4 besoins couverts (hors optionnels)", "30 habitants sur l'île"]], ["Habitants au plus", "160"], ["Rien d'après", "l'an -3000 : visiteurs et achats d'Alyca ne dépassent pas cette date"]]}, {"id": "besoin:village:nourrir", "genre": "besoin", "nom": "Se nourrir", "x": 1800, "y": 100, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "La cueillette ne suffit plus : il faut cultiver ou pêcher."], ["Savoirs qui y répondent (un seul suffit)", ["Les premières récoltes"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:res.cultiver", "genre": "savoir", "nom": "Les premières récoltes", "x": 2014, "y": 100, "l": 176, "h": 46, "fiche": [["Arbre", "Ressources"], ["De quoi il s'agit", "Semer, élever, pêcher : trois façons de ne plus dépendre de ce qu'on trouve, bien avant les premiers villages de paysans."], ["S'apprend à l'âge", "Le village"]]}, {"id": "besoin:village:compter", "genre": "besoin", "nom": "Compter et stocker", "x": 1800, "y": 174, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "Garder des réserves, et savoir combien il en reste."], ["Savoirs qui y répondent (un seul suffit)", ["Compter avant d'écrire"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:math.origines", "genre": "savoir", "nom": "Compter avant d'écrire", "x": 2014, "y": 174, "l": 176, "h": 46, "fiche": [["Arbre", "Logique"], ["De quoi il s'agit", "Des os entaillés il y a 40 000 ans aux comptables d'Uruk : les nombres sont nés bien avant les chiffres."], ["S'apprend à l'âge", "Le village"]]}, {"id": "besoin:village:batir", "genre": "besoin", "nom": "Bâtir", "x": 1800, "y": 248, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "Du bois, de la pierre et des maisons."], ["Savoirs qui y répondent (un seul suffit)", ["Machines simples"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:phys.machines", "genre": "savoir", "nom": "Machines simples", "x": 2014, "y": 248, "l": 176, "h": 46, "fiche": [["Arbre", "Mécanique"], ["De quoi il s'agit", "Levier, roue, poulie, plan incliné : les outils qui démultiplient la force, des premiers agriculteurs à Galilée."], ["S'apprend à l'âge", "Le village"]]}, {"id": "besoin:village:fabriquer", "genre": "besoin", "nom": "Fabriquer", "x": 1800, "y": 322, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "Des pots et des jarres qui passent au feu."], ["Savoirs qui y répondent (un seul suffit)", ["Les premiers ateliers"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:chim.feu", "genre": "savoir", "nom": "Les premiers ateliers", "x": 2014, "y": 322, "l": 176, "h": 46, "fiche": [["Arbre", "Alchimie"], ["De quoi il s'agit", "Argile cuite, pigments, verre, parfums et teintures : bien avant les chimistes, potiers, verriers, parfumeuses et teinturiers transforment la matière dans leurs ateliers."], ["S'apprend à l'âge", "Le village"]]}, {"id": "besoin:village:transmettre", "genre": "besoin", "nom": "Transmettre (optionnel)", "x": 1800, "y": 396, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "Ce que le village sait doit passer aux suivants."], ["Savoirs qui y répondent (un seul suffit)", ["Parler avant la rhétorique", "Les historiens et la rumeur", "Présocratiques"]], ["Obligatoire", "non, optionnel"], ["Si on le néglige", "Sans personne pour transmettre, chaque génération oublie un peu de ce que savait la précédente."]]}, {"id": "savoir:rhet.origines", "genre": "savoir", "nom": "Parler avant la rhétorique", "x": 2014, "y": 396, "l": 176, "h": 46, "fiche": [["Arbre", "Éloquence"], ["De quoi il s'agit", "Ptahhotep, Enheduanna, les aèdes d'Homère : l'art de bien parler, des siècles avant qu'on lui donne un nom."], ["S'apprend à l'âge", "Le village"]]}, {"id": "savoir:biais.historiens", "genre": "savoir", "nom": "Les historiens et la rumeur", "x": 2014, "y": 456, "l": 176, "h": 46, "fiche": [["Arbre", "Lucidité"], ["De quoi il s'agit", "Thucydide, au Ve siècle av. J.-C., repère chez ses contemporains des biais que la psychologie nommera vingt-quatre siècles plus tard."], ["S'apprend à l'âge", "Le village"]]}, {"id": "savoir:philo.presocratiques", "genre": "savoir", "nom": "Présocratiques", "x": 2014, "y": 516, "l": 176, "h": 46, "fiche": [["Arbre", "Sagesse"], ["De quoi il s'agit", "Milet, Héraclite, Parménide, Pythagore, Empédocle, Démocrite : le monde expliqué sans les dieux."], ["S'apprend à l'âge", "Le village"]]}, {"id": "besoin:village:decider", "genre": "besoin", "nom": "Décider ensemble (optionnel)", "x": 1800, "y": 590, "l": 176, "h": 46, "fiche": [["Âge", "Le village"], ["Pourquoi", "Plus on est nombreux, plus il faut s'entendre."], ["Savoirs qui y répondent (un seul suffit)", ["La ruche et l'essaim"]], ["Obligatoire", "non, optionnel"], ["Si on le néglige", "Sans règle pour décider ensemble, les querelles finissent en émeutes, et parfois en coup de force."]]}, {"id": "savoir:coll.ruche", "genre": "savoir", "nom": "La ruche et l'essaim", "x": 2014, "y": 590, "l": 176, "h": 46, "fiche": [["Arbre", "Essaim"], ["De quoi il s'agit", "Huit mille ans de miel, une danse décodée en 1927 et des essaims qui votent : l'intelligence collective commence chez les insectes."], ["S'apprend à l'âge", "Le village"]]}, {"id": "amen:ferme", "genre": "amen", "nom": "Ferme", "x": 2228, "y": 100, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des champs de blé et une grange. Chaque fermier nourrit vingt habitants."], ["Quartier", "Les champs et jardins"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Les premières récoltes"]], ["Coût", "40 crédits"], ["Produit", "nourriture"], ["Épreuve à réussir avant de bâtir", "Armer la ferme"]]}, {"id": "epreuve:moisson", "genre": "epreuve", "nom": "Armer la ferme", "x": 2442, "y": 100, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Ferme » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le blé ne se cueille pas à la main, pas si tu veux nourrir vingt personnes. Il faut une faucille, et le bras pour s'en servir. Deux gestes."], ["Quête avant l'épreuve", "De quoi moissonner. Pas de ferme sans faucille ni semence. Il te faut des épis sauvages, pour le grain, et une branche d'aubépine pour le manche. Le silex, tu l'as déjà au camp : explore l'île."], ["À trouver sur l'île", ["Des épis sauvages, dans les herbes, au sud du lac", "Une branche d'aubépine, vers le nord de l'île"]], ["Gestes", ["La faucille : Frappe le silex, vite et sans t'arrêter : chaque coup détache un petit éclat tranchant. Il en faut une rangée pour garnir le manche.", "La moisson : Fauche les épis : passe la faucille d'un côté à l'autre, sans t'arrêter, jusqu'au bout du champ."]], ["Ce qu'on en retient", "Avec l'apparition de l'agriculture, les populations néolithiques ont tendance à se fixer."], ["Source", "Hominidés.com, « Outils et techniques du Néolithique »"]]}, {"id": "amen:pecherie", "genre": "amen", "nom": "Pêcherie", "x": 2228, "y": 160, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des barques, des filets et un séchoir à poissons. Moins de postes qu'une ferme, mais chaque pêcheur rapporte un peu plus."], ["Quartier", "Le port"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Les premières récoltes"]], ["Coût", "30 crédits, 15 bois"], ["Produit", "nourriture"], ["Épreuve à réussir avant de bâtir", "Armer la pêcherie"]]}, {"id": "epreuve:peche", "genre": "epreuve", "nom": "Armer la pêcherie", "x": 2442, "y": 160, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Pêcherie » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le poisson ne saute pas dans la marmite. Il faut un hameçon, un filet avec ses nœuds, et la patience de s'en servir. Trois gestes."], ["Quête avant l'épreuve", "De quoi pêcher. Pas de pêcherie sans de quoi pêcher. Il te faut un os plat pour l'hameçon, des rameaux de saule pour le filet, de l'écorce pour le faire flotter et des galets pour le lester. Le silex pour percer, tu l'as déjà au camp : explore l'île."], ["À trouver sur l'île", ["Un os plat, à la lisière du bois, au nord-ouest", "Des rameaux de saule, au bord du marais, au sud", "De l'écorce, dans le bois, à l'ouest", "Des galets pour lester, sur la côte ouest"]], ["Gestes", ["L'hameçon : Perce la plaquette d'os : fais aller et venir l'archet, d'avant en arrière, sans t'arrêter. La pointe de silex fait le reste.", "Le filet : Un filet, ce sont des nœuds, des centaines de nœuds. Dessine-les : pose le doigt sur le 1 et fais passer le brin par chaque point, dans l'ordre.", "La pêche : Lance la ligne et attends. Quand le poisson mord, le flotteur plonge : tire à ce moment-là, ni avant, ni après."]], ["Ce qu'on en retient", "Dès le Néolithique, les premiers témoignages de l'utilisation de filets sont attestés. Le filet est d'abord fabriqué en écorce, à la manière d'une vannerie, puis confectionné avec des fibres de lin."], ["Source", "G. Deschamps (coord.), « Les filets maillants », Éditions Quæ, 2009"]]}, {"id": "amen:grenier", "genre": "amen", "nom": "Grenier", "x": 2228, "y": 220, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Un grenier sur pilotis, à l'abri des rats. Il garde 300 rations de plus ; sans lui, ce qui dépasse pourrit."], ["Quartier", "Les champs et jardins"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Compter avant d'écrire"]], ["Coût", "30 crédits, 25 bois, 10 pierre"]]}, {"id": "amen:bucheron", "genre": "amen", "nom": "Camp de bûcherons", "x": 2228, "y": 280, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des haches, une scie de long et une pile de rondins qui sèchent. Le bois sert à presque tout bâtir."], ["Quartier", "La zone artisanale"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Machines simples"]], ["Coût", "25 crédits"], ["Produit", "bois"], ["Épreuve à réussir avant de bâtir", "Former une hache"]]}, {"id": "epreuve:hache", "genre": "epreuve", "nom": "Former une hache", "x": 2442, "y": 280, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Camp de bûcherons » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Pas de bûcherons sans hache. Et une hache, ce n'est pas un caillou au bout d'un bâton : on la taille, on la polit, on l'emmanche. Trois gestes."], ["Quête avant l'épreuve", "De quoi faire une hache. Pas de camp de bûcherons sans hache. Il te faut une roche dure, un bloc de grès pour la polir, un bois de cerf et une branche solide pour le manche : explore l'île de près."], ["À trouver sur l'île", ["Une roche dure, au bord du lac, au sud-ouest", "Un bloc de grès, sur la côte est, au sud du village", "Un bois de cerf, dans le bois, à l'ouest", "Une branche solide, vers le nord de l'île"]], ["Gestes", ["L'ébauche : Frappe la roche avec un galet, vite et sans t'arrêter : chaque coup franc détache un éclat et rapproche la pierre de sa forme.", "Le polissage : Frotte la lame sur le bloc de grès, d'avant en arrière, sans t'arrêter, jusqu'à ce qu'elle soit lisse.", "L'emmanchement : Assemble la hache : touche les pièces dans l'ordre, en partant de la pierre pour finir par le bois."]], ["Ce qu'on en retient", "Avec la hache polie, on défriche la forêt pour créer des surfaces cultivables, on abat des arbres et on taille le bois pour bâtir des maisons."], ["Source", "Hominidés.com, « Outils et techniques du Néolithique »"]]}, {"id": "amen:carriere", "genre": "amen", "nom": "Carrière", "x": 2228, "y": 340, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "On taille la roche du volcan en blocs. Plus lent que le bois, mais il faut de la pierre pour durer."], ["Quartier", "La zone industrielle"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Machines simples"]], ["Coût", "35 crédits, 15 bois"], ["Produit", "pierre"], ["Épreuve à réussir avant de bâtir", "Ouvrir la carrière"]]}, {"id": "epreuve:carriere", "genre": "epreuve", "nom": "Ouvrir la carrière", "x": 2442, "y": 340, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Carrière » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "La roche ne se donne pas. Mais elle a des failles, et il suffit d'y glisser quelque chose de plus têtu qu'elle. Trois gestes."], ["Quête avant l'épreuve", "De quoi fendre la roche. Pas de carrière sans coins ni leviers. Il te faut une pierre à grain fin, pour y tailler les coins, et de longues perches pour faire levier. Le maillet de bois, tu l'as déjà au camp : explore l'île."], ["À trouver sur l'île", ["Une pierre à grain fin, au pied du volcan, au sud-est", "De longues perches, à la lisière du bois, à l'ouest"]], ["Gestes", ["Les coins : Dessine le coin dans la pierre : pose le doigt sur le 1 et suis les points dans l'ordre. Large en haut, pour recevoir les coups ; mince en bas, pour entrer dans la faille.", "La faille : Les coins sont dans le joint de la roche. Frappe-les au maillet, sans t'arrêter : à chaque coup, la faille s'ouvre un peu plus.", "Le levier : Le pilier tient encore debout. Glisse la perche dessous et pèse dessus, encore et encore, jusqu'à le coucher."]], ["Ce qu'on en retient", "À Carn Goedog, de grands piliers naturels se dressent côte à côte, presque à la verticale. À leur pied s'étendait une plate-forme grossière et plane."], ["Source", "M. Parker Pearson et al., « Reconstructing extraction techniques at Stonehenge's bluestone megalith quarries in the Preseli hills of west Wales » (dépôt de l'université de Bournemouth)"]]}, {"id": "amen:maisons", "genre": "amen", "nom": "Rangée de maisons", "x": 2228, "y": 400, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Quatre maisons de pierre au toit de bois. Vingt-cinq places de plus : l'île peut grandir au-delà de ce que ses savoirs offrent."], ["Quartier", "La ville"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Machines simples"]], ["Coût", "15 crédits, 20 bois, 15 pierre"], ["Loge", "25 habitants"]]}, {"id": "amen:four", "genre": "amen", "nom": "Four du potier", "x": 2228, "y": 460, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des jarres cuites qui ferment bien : 150 rations de plus à l'abri des rats et de l'humidité."], ["Quartier", "La zone industrielle"], ["Possible à partir de", "Le village"], ["Savoir requis", ["Les premiers ateliers"]], ["Coût", "30 crédits, 15 bois"], ["Épreuve à réussir avant de bâtir", "Cuire un pot"]]}, {"id": "epreuve:poterie", "genre": "epreuve", "nom": "Cuire un pot", "x": 2442, "y": 460, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Four du potier » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Un tas de terre mouillée n'a jamais rien gardé au sec. Il faut la préparer, la monter et la cuire. Trois gestes, et pas de droit à la fissure."], ["Quête avant l'épreuve", "De quoi faire un pot. Pas de four de potier sans pot à cuire. Il te faut de l'argile, et des coquilles à broyer pour l'empêcher de se fendre. Le bois pour le feu, tu l'as déjà au camp : explore l'île."], ["À trouver sur l'île", ["De l'argile, sur la berge du lac, au sud-ouest", "Des coquilles, sur la côte est"]], ["Gestes", ["La pâte : Broie les coquilles sous la pierre, d'avant en arrière, jusqu'à en faire une poudre : tu la mêleras à l'argile.", "Le pot : Monte le pot rouleau après rouleau, sans traîner : l'argile qui attend sèche et ne colle plus.", "La cuisson : Le feu monte et retombe. Enfourne quand il est au plus chaud : trop tiède, la terre reste friable."]], ["Ce qu'on en retient", "Le four ne viendra que plus tard et permettra de fabriquer des récipients plus résistants : des vases pour stocker des graines, de la nourriture ou des liquides, des marmites pour cuire ou chauffer des aliments."], ["Source", "Hominidés.com, « Outils et techniques du Néolithique »"]]}, {"id": "amen:place", "genre": "amen", "nom": "Place du village", "x": 2228, "y": 590, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "On s'y retrouve pour décider et pour fêter. Les naissances et les arrivées augmentent d'un cinquième."], ["Quartier", "La ville"], ["Possible à partir de", "Le village"], ["Savoir requis", ["La ruche et l'essaim"]], ["Coût", "40 crédits, 10 bois, 10 pierre"]]}, {"id": "age:cite", "genre": "age", "nom": "La cité", "x": 2700, "y": 0, "l": 390, "h": 46, "fiche": [["Ce que vit le joueur", "Le village est devenu trop grand pour tenir dans une seule tête : il faut des métaux, des mesures, des écrits et des règles."], ["Pour passer à : le royaume", ["6 besoins couverts (hors optionnels)", "80 habitants sur l'île"]], ["Habitants au plus", "400"], ["Rien d'après", "l'an 500 : visiteurs et achats d'Alyca ne dépassent pas cette date"]]}, {"id": "besoin:cite:forger", "genre": "besoin", "nom": "Travailler les métaux", "x": 2700, "y": 100, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "La pierre et le bois ne suffisent plus : le métal change les outils, donc tout le reste."], ["Savoirs qui y répondent (un seul suffit)", ["Les métaux"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:chim.metaux", "genre": "savoir", "nom": "Les métaux", "x": 2914, "y": 100, "l": 176, "h": 46, "fiche": [["Arbre", "Alchimie"], ["De quoi il s'agit", "Tirer le cuivre de la pierre, l'allier à l'étain, puis fondre le fer : chaque métal demande un feu plus chaud que le précédent."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:mesurer", "genre": "besoin", "nom": "Mesurer et répartir", "x": 2700, "y": 174, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Des champs à partager, des réserves à compter, des parts à rendre justes."], ["Savoirs qui y répondent (un seul suffit)", ["Babylone et la base 60", "L'Égypte et le papyrus Rhind"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:math.babylone", "genre": "savoir", "nom": "Babylone et la base 60", "x": 2914, "y": 174, "l": 176, "h": 46, "fiche": [["Arbre", "Logique"], ["De quoi il s'agit", "Les scribes de Mésopotamie calculent en base 60, avec des tables et des chiffres qui changent de valeur selon leur place."], ["S'apprend à l'âge", "La cité"], ["Passage exigé avant", "La grotte des deux fleuves"]]}, {"id": "savoir:math.egypte", "genre": "savoir", "nom": "L'Égypte et le papyrus Rhind", "x": 2914, "y": 234, "l": 176, "h": 46, "fiche": [["Arbre", "Logique"], ["De quoi il s'agit", "Fractions à numérateur 1, aire du disque, volume d'une pyramide tronquée : les manuels des scribes égyptiens."], ["S'apprend à l'âge", "La cité"], ["Passage exigé avant", "La grotte du Nil"]]}, {"id": "besoin:cite:lever", "genre": "besoin", "nom": "Lever et moudre", "x": 2700, "y": 308, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Faire travailler le levier, la roue et l'eau à la place des bras."], ["Savoirs qui y répondent (un seul suffit)", ["Archimède, leviers et flotteurs", "Le mouvement selon Aristote"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:phys.archimede", "genre": "savoir", "nom": "Archimède, leviers et flotteurs", "x": 2914, "y": 308, "l": 176, "h": 46, "fiche": [["Arbre", "Mécanique"], ["De quoi il s'agit", "À Syracuse, au IIIe siècle av. J.-C., Archimède démontre la loi du levier, trouve des centres de gravité et énonce la poussée des fluides."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:phys.aristote", "genre": "savoir", "nom": "Le mouvement selon Aristote", "x": 2914, "y": 368, "l": 176, "h": 46, "fiche": [["Arbre", "Mécanique"], ["De quoi il s'agit", "Quatre éléments, des lieux naturels, pas de vide : la physique qui a régné presque deux mille ans, et ce qui clochait."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:guerir", "genre": "besoin", "nom": "Guérir", "x": 2700, "y": 442, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Plus on vit serrés, plus les maladies circulent : il faut des gens dont c'est le métier."], ["Savoirs qui y répondent (un seul suffit)", ["La médecine égyptienne", "Hippocrate et les humeurs"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:sci.egypte", "genre": "savoir", "nom": "La médecine égyptienne", "x": 2914, "y": 442, "l": 176, "h": 46, "fiche": [["Arbre", "Savoir"], ["De quoi il s'agit", "Des papyrus qui trient les blessures, des recettes par centaines, des spécialistes des yeux et des dents : l'Égypte soigne par écrit."], ["S'apprend à l'âge", "La cité"], ["Passage exigé avant", "La grotte du Nil"]]}, {"id": "savoir:sci.hippocrate", "genre": "savoir", "nom": "Hippocrate et les humeurs", "x": 2914, "y": 502, "l": 176, "h": 46, "fiche": [["Arbre", "Savoir"], ["De quoi il s'agit", "À Kos, vers 400 av. J.-C., la maladie cesse d'être une punition des dieux : elle a des causes naturelles, qu'on observe."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:calendrier", "genre": "besoin", "nom": "Tenir le calendrier", "x": 2700, "y": 576, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Semer, récolter et se réunir au bon moment, d'une année sur l'autre."], ["Savoirs qui y répondent (un seul suffit)", ["Les astronomes de Babylone", "Mesurer la Terre"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:astro.babylone", "genre": "savoir", "nom": "Les astronomes de Babylone", "x": 2914, "y": 576, "l": 176, "h": 46, "fiche": [["Arbre", "Cosmos"], ["De quoi il s'agit", "Tablette de Vénus, catalogue MUL.APIN, journaux du ciel : en Mésopotamie, des scribes notent le ciel nuit après nuit pendant des siècles."], ["S'apprend à l'âge", "La cité"], ["Passage exigé avant", "La grotte des deux fleuves"]]}, {"id": "savoir:astro.mesurer", "genre": "savoir", "nom": "Mesurer la Terre", "x": 2914, "y": 636, "l": 176, "h": 46, "fiche": [["Arbre", "Cosmos"], ["De quoi il s'agit", "Aristote la dit ronde, Ératosthène en prend le tour avec une ombre, Aristarque ose la distance du Soleil : la géométrie grecque arpente le ciel."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:ecrire", "genre": "besoin", "nom": "Garder trace", "x": 2700, "y": 710, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Ce que la cité sait ne tient plus dans les mémoires : il faut l'écrire, ou s'entraîner à retenir."], ["Savoirs qui y répondent (un seul suffit)", ["Écrire la musique", "Simonide et le banquet", "Platon contre l'écriture"]], ["Obligatoire", "oui, pour quitter cet âge"]]}, {"id": "savoir:mus.ecriture", "genre": "savoir", "nom": "Écrire la musique", "x": 2914, "y": 710, "l": 176, "h": 46, "fiche": [["Arbre", "Harmonie"], ["De quoi il s'agit", "D'une tablette d'argile à Ougarit à une stèle grecque : les premiers essais pour noter une mélodie, et la peine qu'on a à les relire."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:mnemo.simonide", "genre": "savoir", "nom": "Simonide et le banquet", "x": 2914, "y": 770, "l": 176, "h": 46, "fiche": [["Arbre", "Mnémosyne"], ["De quoi il s'agit", "Un toit qui s'effondre, des convives méconnaissables, et un poète qui les nomme tous d'après leur place : la naissance légendaire de l'art de la mémoire."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:mnemo.platon", "genre": "savoir", "nom": "Platon contre l'écriture", "x": 2914, "y": 830, "l": 176, "h": 46, "fiche": [["Arbre", "Mnémosyne"], ["De quoi il s'agit", "Pour Platon, l'écriture donne l'apparence du savoir et fait oublier. Ironie : on le sait parce qu'il l'a écrit."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:debattre", "genre": "besoin", "nom": "Débattre et voter (optionnel)", "x": 2700, "y": 904, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Une cité se dispute. Autant qu'elle le fasse avec des règles."], ["Savoirs qui y répondent (un seul suffit)", ["Athènes tire au sort", "Le vote des tessons", "Les sophistes", "Les orateurs d'Athènes"]], ["Obligatoire", "non, optionnel"], ["Si on le néglige", "Sans lieu pour débattre, les désaccords d'une cité se règlent dans la rue, et quelques-uns n'en reviennent pas."]]}, {"id": "savoir:coll.tirage", "genre": "savoir", "nom": "Athènes tire au sort", "x": 2914, "y": 904, "l": 176, "h": 46, "fiche": [["Arbre", "Essaim"], ["De quoi il s'agit", "En 508 av. J.-C., Clisthène confie la cité au hasard : un conseil de 500 citoyens tirés au sort, et une machine de pierre pour désigner les jurés."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:coll.ostracisme", "genre": "savoir", "nom": "Le vote des tessons", "x": 2914, "y": 964, "l": 176, "h": 46, "fiche": [["Arbre", "Essaim"], ["De quoi il s'agit", "Graver un nom sur un éclat de poterie pour exiler un homme dix ans : l'ostracisme, premier vote de masse, et ses premières fraudes."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:rhet.sophistes", "genre": "savoir", "nom": "Les sophistes", "x": 2914, "y": 1024, "l": 176, "h": 46, "fiche": [["Arbre", "Éloquence"], ["De quoi il s'agit", "Ve siècle av. J.-C. : Corax à Syracuse, Protagoras et Gorgias à Athènes. La parole s'enseigne, et se paie."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:rhet.orateurs", "genre": "savoir", "nom": "Les orateurs d'Athènes", "x": 2914, "y": 1084, "l": 176, "h": 46, "fiche": [["Arbre", "Éloquence"], ["De quoi il s'agit", "Périclès, Lysias, Isocrate, Démosthène : la parole au cœur de la démocratie athénienne."], ["S'apprend à l'âge", "La cité"]]}, {"id": "besoin:cite:douter", "genre": "besoin", "nom": "Douter et comprendre (optionnel)", "x": 2700, "y": 1158, "l": 176, "h": 46, "fiche": [["Âge", "La cité"], ["Pourquoi", "Savoir se tromper, écouter l'autre, se connaître un peu."], ["Savoirs qui y répondent (un seul suffit)", ["L'art de douter", "L'éléphant et les aveugles", "Socrate et Platon", "Sagesses d'Asie", "L'esprit selon le Bouddha", "Les Caractères de Théophraste"]], ["Obligatoire", "non, optionnel"], ["Si on le néglige", "Une cité qui ne doute de rien cesse de vérifier ce qu'elle sait, et le perd par morceaux."]]}, {"id": "savoir:biais.doute", "genre": "savoir", "nom": "L'art de douter", "x": 2914, "y": 1158, "l": 176, "h": 46, "fiche": [["Arbre", "Lucidité"], ["De quoi il s'agit", "Au Ve siècle av. J.-C., Protagoras oppose deux arguments sur tout sujet ; au IVe siècle av. J.-C., Aristote dresse la liste des faux raisonnements ; Pyrrhon et Sextus Empiricus apprennent à suspendre son jugement."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:biais.elephant", "genre": "savoir", "nom": "L'éléphant et les aveugles", "x": 2914, "y": 1218, "l": 176, "h": 46, "fiche": [["Arbre", "Lucidité"], ["De quoi il s'agit", "Dans l'Inde ancienne, des aveugles se battent autour d'un éléphant ; vers 80, en Chine, Wang Chong pèse les croyances dans la balance."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:philo.socrate", "genre": "savoir", "nom": "Socrate et Platon", "x": 2914, "y": 1278, "l": 176, "h": 46, "fiche": [["Arbre", "Sagesse"], ["De quoi il s'agit", "La maïeutique, la caverne, les Idées, le Banquet et l'Académie."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:philo.asie", "genre": "savoir", "nom": "Sagesses d'Asie", "x": 2914, "y": 1338, "l": 176, "h": 46, "fiche": [["Arbre", "Sagesse"], ["De quoi il s'agit", "Confucius, le Bouddha, Lao-tseu, Zhuangzi, Mencius : les sagesses nées en Inde et en Chine."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:psy.bouddha", "genre": "savoir", "nom": "L'esprit selon le Bouddha", "x": 2914, "y": 1398, "l": 176, "h": 46, "fiche": [["Arbre", "Empathie"], ["De quoi il s'agit", "En Inde, au Ve siècle av. J.-C., le Bouddha observe l'esprit : le désir, la haine, l'ignorance, et l'attention qui les apaise."], ["S'apprend à l'âge", "La cité"]]}, {"id": "savoir:psy.theophraste", "genre": "savoir", "nom": "Les Caractères de Théophraste", "x": 2914, "y": 1458, "l": 176, "h": 46, "fiche": [["Arbre", "Empathie"], ["De quoi il s'agit", "À Athènes, vers 319 av. J.-C., l'élève d'Aristote croque trente types humains : le flatteur, le bavard, le superstitieux…"], ["S'apprend à l'âge", "La cité"]]}, {"id": "amen:moulin", "genre": "amen", "nom": "Moulin", "x": 3128, "y": 308, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une meule que l'eau fait tourner à la place des bras. Chaque moulin rend trois fermes plus productives de moitié."], ["Quartier", "Les champs et jardins"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["Archimède, leviers et flotteurs", "Le mouvement selon Aristote"]], ["Coût", "50 crédits, 30 bois, 20 pierre"], ["Épreuve à réussir avant de bâtir", "Tailler la meule"]]}, {"id": "epreuve:mouture", "genre": "epreuve", "nom": "Tailler la meule", "x": 3342, "y": 308, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Moulin » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le grain entier ne nourrit que les oiseaux. Il faut l'écraser, et pour ça une pierre qui ne bouge pas et une autre qui ne s'arrête pas. Deux gestes."], ["Quête avant l'épreuve", "De quoi moudre. Pas de moulin sans meule. Il te faut une grosse pierre plate, qui ne bougera plus, et une petite pierre ronde qui tienne dans la main. Le grain, tes fermes te le donnent déjà : explore l'île."], ["À trouver sur l'île", ["Une grosse pierre plate, au sud de l'île, entre le lac et le marais", "Une pierre ronde, sur la côte ouest"]], ["Gestes", ["La meule : Dessine le creux de la meule : pose le doigt sur le 1 et suis les points dans l'ordre, pour que le grain n'en tombe pas.", "La mouture : Écrase le grain : pousse la molette d'avant en arrière, sans t'arrêter, jusqu'à ce qu'il n'en reste que de la farine."]], ["Ce qu'on en retient", "Les Romains ont été les premiers à utiliser la force hydraulique, avec les moulins à aubes."], ["Source", "Alimentarium (Vevey), « Meunerie »"]]}, {"id": "amen:mine", "genre": "amen", "nom": "Mine et fonderie", "x": 3128, "y": 368, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une galerie dans le flanc du volcan et un four pour fondre le minerai. Il faut savoir travailler les métaux."], ["Quartier", "La zone industrielle"], ["Possible à partir de", "La cité"], ["Savoir requis", ["Les métaux"]], ["Coût", "60 crédits, 30 bois, 20 pierre"], ["Produit", "métal"], ["Épreuve à réussir avant de bâtir", "Allumer la fonderie"]]}, {"id": "epreuve:fonderie", "genre": "epreuve", "nom": "Allumer la fonderie", "x": 3342, "y": 368, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Mine et fonderie » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Une pierre verte, du feu, du souffle : il en sort du métal. Personne ne te croira avant de l'avoir vu. Trois gestes."], ["Quête avant l'épreuve", "De quoi fondre. Pas de fonderie sans minerai ni four. Il te faut des pierres vertes, chargées de cuivre, et de l'argile pour sceller le four. La pierre, le charbon de bois et les peaux, tu les as déjà au village : explore l'île."], ["À trouver sur l'île", ["Du minerai de cuivre, sur le flanc du volcan, à l'est", "De l'argile, sur la berge du lac, au sud-ouest"]], ["Gestes", ["Le four : Monte le four : dessine sa paroi basse, bloc après bloc, en suivant les points dans l'ordre. L'argile bouchera les joints.", "Le minerai : Trie le minerai et concasse-le : frappe vite, sans t'arrêter, pour ne garder que ce qui est riche en cuivre.", "Le souffle : Le feu monte et retombe avec le soufflet. Lâche ton souffle quand il est au plus chaud : en dessous, le cuivre reste dans la pierre."]], ["Ce qu'on en retient", "À Cabrières, on réduisait des minerais de cuivre sulfurés dès le troisième millénaire avant notre ère."], ["Source", "D. Bourgarit et B. Mille, « La métallurgie chalcolithique de Cabrières : confrontation des données expérimentales et archéologiques en laboratoire », Archéologie en Languedoc, n° 21, 1997"]]}, {"id": "amen:forge", "genre": "amen", "nom": "Forge", "x": 3128, "y": 428, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des outils de métal pour tout le monde : socs, haches, pics. Chaque forge rend quatre aménagements plus productifs d'un quart."], ["Quartier", "La zone artisanale"], ["Possible à partir de", "La cité"], ["Savoir requis", ["Les métaux"]], ["Coût", "60 crédits, 20 pierre, 10 métal"], ["Épreuve à réussir avant de bâtir", "Battre le fer"]]}, {"id": "epreuve:forgeage", "genre": "epreuve", "nom": "Battre le fer", "x": 3342, "y": 428, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Forge » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le métal sort du four en lingot, pas en outil. Il faut le tenir, le chauffer et le battre tant qu'il est chaud. Trois gestes."], ["Quête avant l'épreuve", "De quoi forger. Pas de forge sans enclume, et pas d'enclume sans un billot pour la porter. Il te faut une souche large et dure. Le métal, ta fonderie te le donne déjà : explore l'île."], ["À trouver sur l'île", ["Un billot de bois, dans le bois, à l'ouest"]], ["Gestes", ["La tenaille : Dessine la tenaille : deux branches qui se croisent, pour tenir le fer rouge loin des doigts. Suis les points dans l'ordre.", "La chauffe : Le feu monte et retombe. Sors le fer quand il est au plus chaud : trop tiède, il casse sous le marteau.", "Le marteau : Bats le fer tant qu'il est chaud : frappe fort et vite, sans t'arrêter, la barre devient lame."]], ["Ce qu'on en retient", "Tremper le fer, c'est le refroidir rapidement en le plongeant dans de l'eau ou de l'huile. Le trempage est essentiel dans la fabrication des outils tranchants : haches, couteaux, faucilles, faux."], ["Source", "Vikidia, « Forgeron »"]]}, {"id": "amen:entrepot", "genre": "amen", "nom": "Grand entrepôt", "x": 3128, "y": 488, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des jarres comptées, des tablettes de compte et un gardien qui sait lire les deux. Quatre cents rations de plus à l'abri."], ["Quartier", "Le port"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["Babylone et la base 60", "L'Égypte et le papyrus Rhind"]], ["Coût", "60 crédits, 40 bois, 30 pierre"]]}, {"id": "amen:dispensaire", "genre": "amen", "nom": "Dispensaire", "x": 3128, "y": 548, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des lits, des remèdes rangés et des soignants dont c'est le métier. Chaque dispensaire fait reculer les décès de près d'un tiers."], ["Quartier", "La ville"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["La médecine égyptienne", "Hippocrate et les humeurs"]], ["Coût", "60 crédits, 20 bois, 20 pierre"]]}, {"id": "amen:cadran", "genre": "amen", "nom": "Cadran et calendrier", "x": 3128, "y": 608, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une ombre qui tourne et quelqu'un qui tient le compte des jours. On sème au bon moment : quatre fermes donnent un quart de plus."], ["Quartier", "Le campus"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["Les astronomes de Babylone", "Mesurer la Terre"]], ["Coût", "50 crédits, 30 pierre"], ["Épreuve à réussir avant de bâtir", "Dresser le cadran"]]}, {"id": "epreuve:gnomon", "genre": "epreuve", "nom": "Dresser le cadran", "x": 3342, "y": 608, "l": 176, "h": 46, "fiche": [["Rôle", "Garde l'aménagement « Cadran et calendrier » : on ne le bâtit qu'après l'avoir réussie, une seule fois."], ["En deux mots", "Le soleil donne l'heure et la saison à qui sait lire une ombre. Il suffit d'un bâton, à condition de le planter droit. Deux gestes."], ["Quête avant l'épreuve", "De quoi lire le ciel. Pas de cadran sans style. Il te faut un long bâton bien droit, et des cailloux clairs pour marquer l'ombre. Le sol plat, ta place du village te le donne déjà : explore l'île."], ["À trouver sur l'île", ["Un bâton bien droit, vers le nord de l'île", "Des cailloux clairs, sur la côte est"]], ["Gestes", ["Le style : Plante le bâton bien droit : dessine-le du sol jusqu'en haut, sans dévier. Un bâton penché ment sur l'heure.", "L'ombre : Du matin au soir, pose un caillou au bout de l'ombre : suis les points dans l'ordre et regarde où elle est la plus courte."]], ["Ce qu'on en retient", "Le gnomon est un instrument astronomique antique formé d'un simple bâton vertical projetant une ombre au sol."], ["Source", "Herodote.net, « Gnomon »"]]}, {"id": "amen:archives", "genre": "amen", "nom": "Maison des écrits", "x": 3128, "y": 710, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Des rouleaux, des tablettes et des gens qui récitent. On vient de loin pour y lire, et un savant de plus passe chaque jour."], ["Quartier", "Le campus"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["Écrire la musique", "Simonide et le banquet", "Platon contre l'écriture"]], ["Coût", "60 crédits, 30 bois, 20 pierre"]]}, {"id": "amen:tribune", "genre": "amen", "nom": "Tribune", "x": 3128, "y": 904, "l": 176, "h": 46, "fiche": [["À quoi ça sert", "Une estrade de pierre où chacun peut parler à son tour. Une cité où l'on s'écoute attire du monde."], ["Quartier", "L'agora"], ["Possible à partir de", "La cité"], ["Savoir requis (un au choix)", ["Athènes tire au sort", "Le vote des tessons", "Les sophistes", "Les orateurs d'Athènes"]], ["Coût", "50 crédits, 30 pierre"]]}, {"id": "age:royaume", "genre": "age", "nom": "Le royaume", "x": 3600, "y": 0, "l": 390, "h": 46, "fiche": [["Ce que vit le joueur", "Des routes, des écoles, des machines et des cartes : cet âge arrive bientôt."], ["Habitants au plus", "sans limite"], ["Rien d'après", "l'an 1500 : visiteurs et achats d'Alyca ne dépassent pas cette date"], ["État", "Cet âge reste à écrire : pas encore de besoins."]]}, {"id": "grotte:ornee", "genre": "grotte", "nom": "La grotte ornée", "x": 900, "y": 634, "l": 176, "h": 46, "fiche": [["Ce que c'est", "Une grotte aux parois peintes. Des gens sont venus ici bien avant toi, une flamme à la main, pour dessiner des bêtes dans le noir."], ["Apparaît à l'âge", "Le campement"], ["Comment y entrer", "Envoyer un explorateur avec une torche : elle se cache sous le brouillard."], ["À trouver dans les galeries", ["Les chevaux de Chauvet", "La roche raclée", "La main en négatif", "Le crâne de l'ours", "Les taureaux de Lascaux", "Peindre à la lampe"]], ["Quiz", "4 réponses justes sur 6 pour graver le passage"], ["Sources", ["Hominidés.com, « La grotte Chauvet »", "Ministère de la Culture, « Grotte Chauvet : retour sur la découverte du premier chef-d'œuvre de l'humanité »", "World History Encyclopedia, « La grotte de Lascaux »"]], ["Ce que le passage ouvre", ["l'épreuve qui fait quitter le campement"]]]}, {"id": "grotte:mesopotamie", "genre": "grotte", "nom": "La grotte des deux fleuves", "x": 2700, "y": 1562, "l": 176, "h": 46, "fiche": [["Ce que c'est", "Des galeries où attendent les dieux de Sumer et d'Akkad. Leurs histoires ont fini sur des tablettes d'argile."], ["Apparaît à l'âge", "La cité"], ["Comment y entrer", "Envoyer un explorateur avec une torche : elle se cache sous le brouillard."], ["À trouver dans les galeries", ["Enki, le plus sage", "Inanna aux Enfers", "Gilgamesh, roi d'Uruk", "Nisaba, scribe des dieux", "Nanna, la lune", "Marduk contre Tiamat"]], ["Quiz", "4 réponses justes sur 6 pour graver le passage"], ["Sources", ["Vikidia, « Épopée de Gilgamesh »", "World History Encyclopedia, « Panthéon mésopotamien »"]], ["Ce que le passage ouvre", ["Babylone et la base 60", "Les astronomes de Babylone"]]]}, {"id": "grotte:mythologies", "genre": "grotte", "nom": "La grotte du Nil", "x": 2700, "y": 1622, "l": 176, "h": 46, "fiche": [["Ce que c'est", "Un labyrinthe sous le volcan. Dans ses galeries, des dieux peints attendent qu'on les trouve, et des bêtes rôdent."], ["Apparaît à l'âge", "La cité"], ["Comment y entrer", "Envoyer un explorateur avec une torche : elle se cache sous le brouillard."], ["À trouver dans les galeries", ["Rê, le soleil en barque", "Osiris, roi des morts", "La pesée du cœur", "Thot, le dieu des scribes", "Sekhmet, la lionne qui guérit"]], ["Quiz", "4 réponses justes sur 5 pour graver le passage"], ["Sources", ["Vikidia, « Jugement du mort par Osiris »", "Vikidia, « Osiris »", "Vikidia, « Rê »", "Vikidia, « Sekhmet »", "Vikidia, « Thot »"]], ["Ce que le passage ouvre", ["La médecine égyptienne", "L'Égypte et le papyrus Rhind"]]]}, {"id": "grotte:celtes", "genre": "grotte", "nom": "La grotte du chêne", "x": 2700, "y": 1682, "l": 176, "h": 46, "fiche": [["Ce que c'est", "Sous la forêt, des galeries où attendent les dieux des Celtes. Eux n'ont rien écrit : il a fallu que d'autres racontent à leur place."], ["Apparaît à l'âge", "La cité"], ["Comment y entrer", "Envoyer un explorateur avec une torche : elle se cache sous le brouillard."], ["À trouver dans les galeries", ["Les druides, vingt ans par cœur", "Le bosquet sacré", "Cernunnos, le dieu cornu", "Épona et Belenos", "Taranis et Toutatis", "Le chaudron du Dagda"]], ["Quiz", "4 réponses justes sur 6 pour graver le passage"], ["Sources", ["World History Encyclopedia, « Ancienne religion celtique »", "World History Encyclopedia, « Le panthéon des anciens Celtes »", "World History Encyclopedia, « Le panthéon des anciens Celtes » et « Ancienne religion celtique »"]], ["Ce que le passage ouvre", "Rien pour l'instant."]]}], "liens": [{"de": "besoin:survivants:survivre", "vers": "savoir:ile.feu", "genre": "couvre", "titre": "Besoin couvert par ce savoir", "texte": "Maîtriser « Maîtriser le feu » suffit à couvrir le besoin
